<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Babylon Lite — Demo: Antigravity Racer</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #050308;
                overscroll-behavior: none;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }
            #ag-canvas-wrap {
                position: fixed;
                inset: 0;
                display: flex;
            }
            #ag-canvas-wrap canvas {
                flex: 1 1 auto;
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
                outline: none;
            }
            #ag-canvas-wrap.ag-split canvas {
                width: 50%;
            }
            #ag-canvas-wrap.ag-split::after {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                left: 50%;
                width: 2px;
                background: rgba(150, 220, 255, 0.45);
                box-shadow: 0 0 12px rgba(120, 200, 255, 0.6);
                pointer-events: none;
            }

            /* ── Loading overlay ─────────────────────────────────────────── */
            .loading-overlay {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(ellipse at 50% 30%, #170f2c 0%, #050308 70%);
                color: #eef0ff;
                transition: opacity 0.5s ease;
            }
            .loading-overlay.is-hidden {
                opacity: 0;
                pointer-events: none;
            }
            .loading-box {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                text-align: center;
                padding: 0 1rem;
            }
            .loading-spinner {
                width: 54px;
                height: 54px;
                border-radius: 50%;
                border: 4px solid rgba(120, 200, 255, 0.2);
                border-top-color: #7fe0ff;
                animation: ag-spin 0.9s linear infinite;
            }
            .loading-label {
                font-size: 1.05rem;
                font-weight: 600;
                letter-spacing: 0.04em;
            }
            .loading-sub {
                font-size: 0.8rem;
                color: #9aa0c0;
            }
            .loading-bar {
                width: 260px;
                max-width: 62vw;
                height: 4px;
                border-radius: 999px;
                overflow: hidden;
                background: rgba(150, 200, 255, 0.16);
                opacity: 0;
                transition: opacity 0.25s ease;
            }
            .loading-overlay.has-progress .loading-bar {
                opacity: 1;
            }
            .loading-bar-fill {
                width: 0%;
                height: 100%;
                border-radius: inherit;
                background: #7fe0ff;
                transition: width 0.25s ease;
            }
            .loading-size {
                font-size: 0.75rem;
                color: #c4c9e4;
                min-height: 1em;
            }
            @keyframes ag-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .loading-spinner {
                    animation-duration: 2.4s;
                }
            }

            /* ── Shared glass-panel look ─────────────────────────────────── */
            .ag-btn {
                appearance: none;
                border: 1px solid rgba(150, 200, 255, 0.22);
                border-radius: 12px;
                padding: 14px 22px;
                font:
                    600 0.95rem/1 system-ui,
                    sans-serif;
                letter-spacing: 0.01em;
                color: #eaf0ff;
                background: rgba(255, 255, 255, 0.06);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.15s ease,
                    border-color 0.15s ease;
                text-align: left;
            }
            .ag-btn:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(150, 200, 255, 0.45);
            }
            .ag-btn:focus-visible {
                outline: 2px solid #7fe0ff;
                outline-offset: 2px;
            }
            .ag-btn:active {
                transform: scale(0.98);
            }
            .ag-btn-primary {
                background: linear-gradient(135deg, #6a5cff 0%, #34d1ff 100%);
                border-color: transparent;
                color: #0a0a14;
                font-weight: 700;
            }
            .ag-btn-primary:hover {
                filter: brightness(1.08);
                background: linear-gradient(135deg, #6a5cff 0%, #34d1ff 100%);
            }
            .ag-menu-buttons {
                display: flex;
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }
            .ag-menu-hint {
                margin-top: 14px;
                font-size: 0.78rem;
                color: #9aa0c0;
                text-align: center;
            }
            .ag-menu-hint b {
                color: #7fe0ff;
            }

            /* ── Main menu ────────────────────────────────────────────────── */
            .ag-menu {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(ellipse at 50% 20%, rgba(50, 30, 90, 0.55) 0%, rgba(4, 2, 10, 0.72) 65%);
            }
            .ag-menu-panel {
                width: min(420px, 92vw);
                max-height: 92vh;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 34px 30px;
                border-radius: 22px;
                border: 1px solid rgba(150, 200, 255, 0.18);
                background: rgba(14, 10, 26, 0.66);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            }
            .ag-menu-kicker {
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.22em;
                color: #7fe0ff;
                margin-bottom: 6px;
            }
            .ag-menu-title {
                margin: 0 0 10px;
                font-size: 2rem;
                line-height: 1.05;
                font-weight: 800;
                letter-spacing: 0.01em;
                text-align: center;
                color: #f4f6ff;
            }
            .ag-menu-title span {
                display: block;
                background: linear-gradient(135deg, #6a5cff, #34d1ff);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            .ag-menu-tagline {
                margin: 0 0 22px;
                font-size: 0.88rem;
                color: #c3c8e6;
                text-align: center;
                line-height: 1.4;
            }
            .ag-menu-credit {
                margin-top: 16px;
                font-size: 0.68rem;
                color: #767ba0;
                text-align: center;
                line-height: 1.4;
            }
            .ag-menu-credit a {
                color: #9aa3d0;
                text-decoration: underline;
            }

            /* ── Race HUD ─────────────────────────────────────────────────── */
            .ag-hud {
                position: fixed;
                inset: 0;
                z-index: 20;
                pointer-events: none;
                color: #eaf0ff;
            }
            .ag-hud-pane {
                position: absolute;
                top: 0;
                bottom: 0;
            }
            .ag-hud-panel {
                position: absolute;
                top: 16px;
                left: 16px;
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 10px 16px;
                border-radius: 14px;
                background: rgba(10, 8, 20, 0.55);
                border: 1px solid rgba(150, 200, 255, 0.18);
                backdrop-filter: blur(6px);
            }
            .ag-hud-speed {
                font-variant-numeric: tabular-nums;
                font-weight: 700;
            }
            .ag-hud-speed-val {
                font-size: 1.5rem;
                color: #7fe0ff;
            }
            .ag-hud-speed-unit {
                font-size: 0.7rem;
                color: #9aa0c0;
                margin-left: 4px;
            }
            .ag-hud-rank {
                font-size: 1.1rem;
                font-weight: 700;
                color: #ffd27f;
            }
            .ag-hud-rank span {
                font-size: 0.7rem;
                color: #9aa0c0;
                font-weight: 500;
            }
            .ag-hud-boost {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: rgba(150, 200, 255, 0.25);
            }
            .ag-hud-boost.is-active {
                background: #7fe0ff;
                box-shadow: 0 0 10px #7fe0ff;
            }
            .ag-hud-hint {
                position: fixed;
                left: 50%;
                bottom: 16px;
                transform: translateX(-50%);
                padding: 7px 16px;
                border-radius: 999px;
                background: rgba(10, 8, 20, 0.55);
                border: 1px solid rgba(150, 200, 255, 0.14);
                font-size: 0.76rem;
                color: #cdd3f0;
                white-space: nowrap;
                backdrop-filter: blur(6px);
            }

            /* ── Pause overlay ────────────────────────────────────────────── */
            .ag-overlay {
                position: fixed;
                inset: 0;
                z-index: 30;
                display: none;
                align-items: center;
                justify-content: center;
                background: rgba(4, 2, 10, 0.72);
                pointer-events: auto;
            }
            .ag-overlay-panel {
                width: min(340px, 88vw);
                padding: 28px 26px;
                border-radius: 20px;
                background: rgba(14, 10, 26, 0.75);
                border: 1px solid rgba(150, 200, 255, 0.2);
                backdrop-filter: blur(16px);
                text-align: center;
            }
            .ag-overlay-panel h2 {
                margin: 0 0 18px;
                letter-spacing: 0.15em;
                font-size: 1.3rem;
                color: #f4f6ff;
            }

            /* ── Attract-mode exit hint ────────────────────────────────────── */
            .ag-attract-hint {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 40;
            }
            .ag-attract-btn {
                appearance: none;
                display: flex;
                align-items: center;
                gap: 8px;
                border: 1px solid rgba(150, 200, 255, 0.22);
                border-radius: 999px;
                padding: 10px 18px;
                font:
                    600 0.82rem/1 system-ui,
                    sans-serif;
                color: #eaf0ff;
                background: rgba(10, 8, 20, 0.6);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease;
            }
            .ag-attract-btn span {
                font-size: 0.7rem;
                color: #9aa0c0;
            }
            .ag-attract-btn:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(150, 200, 255, 0.45);
            }
            .ag-attract-btn:focus-visible {
                outline: 2px solid #7fe0ff;
                outline-offset: 2px;
            }
            .ag-attract-btn:active {
                transform: scale(0.98);
            }

            /* ── Track editor toolbar ─────────────────────────────────────── */
            .ag-editor-hud {
                position: fixed;
                top: 16px;
                right: 16px;
                z-index: 20;
                width: min(280px, 42vw);
            }
            .ag-editor-panel {
                padding: 16px;
                border-radius: 16px;
                background: rgba(10, 8, 20, 0.6);
                border: 1px solid rgba(150, 200, 255, 0.18);
                backdrop-filter: blur(10px);
                color: #eaf0ff;
            }
            .ag-editor-title {
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.16em;
                color: #7fe0ff;
                margin-bottom: 8px;
            }
            .ag-editor-selected {
                font-size: 0.95rem;
                font-weight: 600;
                margin-bottom: 6px;
            }
            .ag-editor-hint {
                font-size: 0.72rem;
                color: #9aa0c0;
                line-height: 1.4;
                margin-bottom: 14px;
            }
            .ag-editor-buttons .ag-btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }

            @media (max-width: 640px) {
                .ag-menu-title {
                    font-size: 1.6rem;
                }
                .ag-editor-hud {
                    width: min(240px, 60vw);
                }
            }
        </style>
    </head>
    <body>
        <!--
    This page loads the production-BUNDLED demo (tree-shaken + minified) from
    /bundle/demos/, NOT the raw TypeScript source. Run `pnpm build:bundle-demos`
    (also part of `pnpm dev:lab`) to (re)generate the bundle this page references.
  -->
        <div id="ag-canvas-wrap">
            <canvas id="renderCanvas"></canvas>
        </div>
        <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
            <div class="loading-box">
                <div class="loading-spinner" aria-hidden="true"></div>
                <div class="loading-label">Loading Antigravity Racer…</div>
                <div class="loading-sub">Fetching the ship and rock models and the road artwork, then bending the track piece onto its spline.</div>
                <div class="loading-bar" aria-hidden="true"><div id="loadingBarFill" class="loading-bar-fill"></div></div>
                <div class="loading-size" aria-hidden="true">Estimated demo assets: 14 MB</div>
            </div>
        </div>
        <script>
            // Loading screen: hide once the demo signals ready (or errors) via the canvas
            // data attributes it sets when its assets are loaded and the engine starts.
            (function () {
                var overlay = document.getElementById("loadingOverlay");
                var canvas = document.getElementById("renderCanvas");
                if (!overlay || !canvas) return;
                var done = false;
                var observer = null;
                function hide() {
                    if (done) return;
                    done = true;
                    if (observer) {
                        observer.disconnect();
                        observer = null;
                    }
                    overlay.classList.add("is-hidden");
                    setTimeout(function () {
                        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    }, 600);
                }
                function check() {
                    if (canvas.dataset.ready === "true" || canvas.dataset.error) {
                        hide();
                        return true;
                    }
                    return false;
                }
                if (!check()) {
                    observer = new MutationObserver(check);
                    observer.observe(canvas, { attributes: true, attributeFilter: ["data-ready", "data-error"] });
                    setTimeout(hide, 45000);
                }
            })();
        </script>
        <script>
            // Determinate progress + phase detail: mirror canvas data-progress /
            // data-loading-detail / data-loading-size (set by installFetchProgress)
            // into the overlay. Independent of the hide logic above.
            (function () {
                var canvas = document.getElementById("renderCanvas");
                var overlay = document.getElementById("loadingOverlay");
                if (!canvas || !overlay) return;
                var fill = document.getElementById("loadingBarFill");
                var sub = overlay.querySelector(".loading-sub");
                var size = overlay.querySelector(".loading-size");
                function sync() {
                    var p = canvas.dataset.progress;
                    if (p !== undefined && p !== "") {
                        overlay.classList.add("has-progress");
                        if (fill) fill.style.width = Math.max(0, Math.min(100, +p)) + "%";
                    } else {
                        overlay.classList.remove("has-progress");
                    }
                    var d = canvas.dataset.loadingDetail;
                    if (d !== undefined && d !== "" && sub) sub.textContent = d;
                    var sz = canvas.dataset.loadingSize;
                    if (sz !== undefined && sz !== "" && size) size.textContent = sz;
                }
                sync();
                new MutationObserver(sync).observe(canvas, { attributes: true, attributeFilter: ["data-progress", "data-loading-detail", "data-loading-size"] });
            })();
        </script>
        <script type="module" src="/lite/bundle/demos/antigravity-racer.js"></script>
    </body>
</html>
