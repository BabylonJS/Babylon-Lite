<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Babylon Lite — Screen-Space Effects</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #080b12;
                font-family: system-ui, sans-serif;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            .controls {
                position: fixed;
                left: 18px;
                top: 18px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                max-width: calc(100vw - 36px);
                z-index: 4;
            }
            button {
                border: 1px solid #7685a8;
                border-radius: 999px;
                padding: 9px 14px;
                color: #f5f7ff;
                background: rgba(26, 34, 53, 0.88);
                cursor: pointer;
                backdrop-filter: blur(8px);
            }
            button.disabled {
                color: #929bb2;
                border-color: #4b5265;
                background: rgba(20, 24, 35, 0.82);
            }
            .loading {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: grid;
                place-items: center;
                color: #eef2ff;
                background: #080b12;
                transition: opacity 0.35s ease;
            }
            .loading.hidden {
                opacity: 0;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <div class="controls">
            <button id="toggleContact"></button>
            <button id="toggleGi"></button>
            <button id="toggleOrbit"></button>
        </div>
        <div id="loading" class="loading">Building screen-space effects…</div>
        <script>
            (function () {
                var canvas = document.getElementById("renderCanvas");
                var loading = document.getElementById("loading");
                function check() {
                    if (canvas.dataset.ready === "true" || canvas.dataset.error) {
                        loading.classList.add("hidden");
                        setTimeout(function () {
                            loading.remove();
                        }, 400);
                    }
                }
                new MutationObserver(check).observe(canvas, { attributes: true, attributeFilter: ["data-ready", "data-error"] });
            })();
        </script>
        <script type="module" src="/lite/bundle/demos/screen-space-effects.js"></script>
    </body>
</html>
