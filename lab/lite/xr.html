<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babylon Lite — WebXR (WebGPU binding)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px; max-width: 360px;
    }
    .row { display: flex; gap: 8px; }
    button {
      padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
      border: 0; border-radius: 8px; background: #2b6cff; color: #fff;
    }
    button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    #status {
      padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4;
      background: rgba(0, 0, 0, 0.6); color: #eee; backdrop-filter: blur(4px);
    }
    #status code { color: #ffd479; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <div class="row">
      <button id="enterVr" disabled>Enter VR</button>
      <button id="enterAr" disabled>Enter AR</button>
      <button id="exitXr" disabled>Exit XR</button>
    </div>
    <div id="status">Checking WebXR / WebGPU binding support…</div>
    <div id="hint" style="padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.4;background:rgba(0,0,0,0.5);color:#cfcfcf">Grab: reach a controller to a cube and hold <strong>grip</strong> (or the trigger) to pick it up; release to drop.</div>
  </div>
  <script type="module" src="/lite/src/xr.ts"></script>
</body>
</html>
