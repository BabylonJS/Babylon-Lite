<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Scene 187 — SMAA Comparison</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #020307;
            }
            body {
                position: relative;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            .panel-label {
                position: absolute;
                top: 18px;
                color: #fff;
                font:
                    700 18px/1 system-ui,
                    sans-serif;
                letter-spacing: 0.12em;
                text-shadow: 0 1px 4px #000;
                pointer-events: none;
            }
            .panel-label.left {
                left: 24px;
            }
            .panel-label.right {
                left: calc(50% + 24px);
            }
            .divider {
                position: absolute;
                top: 0;
                bottom: 0;
                left: calc(50% - 1px);
                width: 2px;
                background: #65738c;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas" width="1280" height="720"></canvas>
        <div class="panel-label left">NO AA</div>
        <div class="panel-label right">SMAA</div>
        <div class="divider"></div>
        <script src="/loader.js"></script>
        <script type="module" src="/lite/src/lite/scene187.ts"></script>
    </body>
</html>
