<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Babylon Lite - USD Drop Test</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #090d18;
                color: #fff;
                font-family: Inter, system-ui, sans-serif;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #dropZone {
                position: fixed;
                inset: 20px;
                display: grid;
                place-content: center;
                gap: 14px;
                padding: 32px;
                border: 2px dashed #5f85d8;
                border-radius: 16px;
                background: rgb(11 18 34 / 90%);
                text-align: center;
                transition:
                    opacity 160ms,
                    border-color 160ms,
                    background 160ms;
            }
            #dropZone.dragging {
                border-color: #82b1ff;
                background: rgb(28 53 94 / 94%);
            }
            #dropZone.loading {
                border-style: solid;
            }
            #dropZone.loaded {
                inset: auto 16px 16px;
                display: block;
                max-width: min(760px, calc(100% - 64px));
                padding: 12px 16px;
                border: 0;
                border-radius: 8px;
                background: rgb(0 0 0 / 72%);
                pointer-events: none;
            }
            h1 {
                margin: 0;
                font-size: 28px;
            }
            p {
                max-width: 680px;
                margin: 0;
                color: #bdc9df;
                line-height: 1.5;
            }
            .actions {
                display: flex;
                justify-content: center;
                gap: 10px;
            }
            label {
                padding: 9px 14px;
                border-radius: 7px;
                background: #315ca8;
                cursor: pointer;
            }
            input {
                display: none;
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <div id="dropZone">
            <h1>Drop an OpenUSD asset</h1>
            <p>
                Drop one USD/USDZ file, multiple related files, or a complete folder. Folder paths are preserved so sublayers, references, payloads, and textures resolve
                as authored.
            </p>
            <div class="actions">
                <label>Choose files<input id="files" type="file" accept=".usd,.usda,.usdc,.usdz" multiple /></label>
                <label>Choose folder<input id="folder" type="file" webkitdirectory multiple /></label>
            </div>
            <p id="status">Waiting for files...</p>
        </div>
        <script src="/loader.js"></script>
        <script type="module" src="/lite/src/lite/usd-drop.ts"></script>
    </body>
</html>
