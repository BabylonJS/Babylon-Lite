<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Babylon Lite — Navcat Navigation</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #101c2a;
                color: #e5eefb;
                font:
                    14px/1.5 system-ui,
                    sans-serif;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            .panel {
                position: fixed;
                top: 18px;
                left: 18px;
                width: 270px;
                padding: 20px;
                background: #152437f0;
                border: 1px solid #38506a;
                border-radius: 12px;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 21px;
            }
            p {
                margin: 8px 0 16px;
                color: #bed0e5;
            }
            label {
                display: block;
                margin: 10px 0;
            }
            select {
                display: block;
                width: 100%;
                margin-top: 4px;
            }
            select,
            button {
                font: inherit;
                color: inherit;
                background: #213b56;
                border: 1px solid #5a7795;
                border-radius: 5px;
                padding: 7px;
            }
            button {
                cursor: pointer;
                margin: 3px 2px 3px 0;
            }
            button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            :focus-visible {
                outline: 3px solid #8ddcf5;
                outline-offset: 3px;
            }
            .check {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #status {
                min-height: 3em;
                color: #b8f2d4;
            }
            a {
                color: #a8d9ff;
            }
            @media (max-width: 600px) {
                canvas {
                    height: 55dvh;
                }
                .panel {
                    top: 55dvh;
                    bottom: 0;
                    left: 0;
                    right: 0;
                    width: auto;
                    padding: 12px;
                    overflow-y: auto;
                    font-size: 12px;
                    line-height: 1.35;
                }
                h1 {
                    font-size: 18px;
                }
                .panel > p:first-of-type {
                    display: none;
                }
                p {
                    margin: 5px 0;
                }
                label {
                    margin: 5px 0;
                }
                label:not(.check) {
                    display: grid;
                    grid-template-columns: 85px 1fr;
                    gap: 8px;
                    align-items: center;
                }
                select {
                    margin-top: 0;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas" aria-label="Navigation floor, endpoint markers and calculated route"></canvas>
        <section class="panel" aria-labelledby="title">
            <h1 id="title">Navcat Navigation</h1>
            <p>Offline-baked JSON. Pure JavaScript queries. Green start → coral destination.</p>
            <label
                >Start<select id="start">
                    <option value="2">Upper left</option>
                    <option value="-2">Lower left</option>
                </select></label
            >
            <label
                >Destination<select id="end">
                    <option value="-2">Lower right</option>
                    <option value="2">Upper right</option>
                </select></label
            >
            <label
                >Traversal filter<select id="filter">
                    <option value="default">All areas</option>
                    <option value="blocked">Exclude area 2</option>
                    <option value="cost">Area 2 costs ×4</option>
                </select></label
            >
            <label class="check"><input id="debug" type="checkbox" checked />Show navmesh and search</label>
            <div><button id="query" type="button">Query route</button><button id="replace" type="button">Replace mesh</button></div>
            <div><button id="dispose" type="button">Dispose</button><button id="reload" type="button">Reload / reset</button></div>
            <p id="status" role="status" aria-live="polite">Loading navigation…</p>
            <a href="https://github.com/isaac-mason/navcat" target="_blank" rel="noopener noreferrer">Navcat (MIT)</a>
        </section>
        <script type="module" src="/bundle/demos/navcat.js"></script>
    </body>
</html>
