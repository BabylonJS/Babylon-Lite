<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Babylon Lite - Demo: NPE on Sprite2D</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04010b; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #f6d8bd; background: #04010b;
      font: 600 15px Georgia, serif; letter-spacing: 0;
      transition: opacity 0.35s ease;
    }
    .loading.is-hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="loading" class="loading" role="status">Igniting particles...</div>
  <script>
    (function () {
      var canvas = document.getElementById("renderCanvas");
      var loading = document.getElementById("loading");
      if (!canvas || !loading) return;
      function check() {
        if (canvas.dataset.ready === "true" || canvas.dataset.error) {
          loading.classList.add("is-hidden");
          setTimeout(function () { loading.remove(); }, 400);
        }
      }
      new MutationObserver(check).observe(canvas, { attributes: true, attributeFilter: ["data-ready", "data-error"] });
      check();
    })();
  </script>
  <script type="module" src="/lite/bundle/demos/npe-sprite2d.js"></script>
</body>
</html>
