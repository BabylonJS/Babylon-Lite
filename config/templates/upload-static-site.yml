# Reusable step template: upload a static site directory and post its link to the PR
#
# SECURITY CONTRACT (read before adding a call site)
# --------------------------------------------------
# This template hands a long-lived deploy token to an authenticated upload. It
# MUST only be used from a job that has not executed repository-authored code —
# no checkout of a PR ref, no `pnpm install` (which runs dependency lifecycle
# scripts), no build and no test steps. PR CI therefore builds the site in an
# untrusted, secretless job, publishes it as a pipeline artifact, and calls this
# template from a separate `checkout: none` job. That job boundary is what makes
# the destination trustworthy: a runtime `##vso[task.setvariable]` can rewrite
# DEPLOYMENT_SERVER, STORAGE_ACCOUNT and friends, so if attacker-controlled code
# had run first it could point this authenticated curl at its own host and
# capture DEPLOY_TOKEN.
#
# For a pull-request build Azure reads the pipeline definition from the pull
# request, so the call site itself is only as trustworthy as the file it lives
# in. Every PR-context call site must therefore sit in `config/templates/pr-ci.yml`,
# which `azure-pipelines.yml` reaches through a repository resource pinned to
# refs/heads/master, and must pass `requireHostAllowlist: true`.
#
# As defence in depth the script below also:
#   * refuses any deploy path outside a fixed allowlist (see ALLOWED_PATH_RE),
#   * requires the destination host to appear in the COMPILE-TIME allowlist
#     `allowedDeployHosts` below — an https URL alone is not a destination check,
#     since any host can serve https,
#   * rejects deploy variables containing multipart/form-data metacharacters,
#   * pins curl to https, refuses redirects, and passes DEPLOY_TOKEN through
#     `env:` instead of macro-expanding it into the generated script body, then
#     hands it to curl on stdin as a `--config -` file rather than in an `-H`
#     argument, so the secret reaches neither the script text nor a command line.
#
# Parameters:
#   siteDir        - path to the static site folder to zip and upload
#   deployPath     - storage path where the site should be served; must match
#                    ALLOWED_PATH_RE below
#   siteName       - label used in display names and the PR comment
#   postComment    - post a PR comment with the link (default true)
#   storageAccount - storage account to upload to (default $(STORAGE_ACCOUNT))
#   linkUrl        - public URL to link in the PR comment (when postComment)
#   cdnEndpoint    - CDN endpoint to purge after upload; "" skips the purge
#   cdnProfile     - CDN profile the endpoint belongs to
#   requireHostAllowlist - refuse to fall back to the runtime DEPLOY_HOST_ALLOWLIST
#                    variable. Mandatory for every call site reachable from a PR
#                    build, where a runtime variable is not an acceptable source
#                    for a destination.
#
# Required pipeline variables:
#   BabylonJS-Deployment variable group: DEPLOYMENT_SERVER, DEPLOY_TOKEN
#   Report upload settings: DEPLOY_ENDPOINT_UPLOAD, DEPLOY_ENDPOINT_PURGE,
#     STORAGE_ACCOUNT, SERVE_DOMAIN
#   Playground snapshots additionally pass TOOLS_STORAGE_ACCOUNT via storageAccount.
#   Scope these groups to the calling job — never to the whole pipeline.
# Required service connection:
#   BabylonBotPAT - GitHub PAT service connection for PR comments

parameters:
    - name: siteDir
      type: string
    - name: deployPath
      type: string
    - name: siteName
      type: string
    # ── Compile-time destination allowlist ────────────────────────────────
    # The set of hosts this template may ever send DEPLOY_TOKEN to. It is a
    # template parameter, so it is fixed when the run is compiled, before any
    # step executes: no `##vso[task.setvariable]`, no queue-time variable and no
    # variable-group edit can add a host to it. That is the difference between
    # this and the DEPLOY_HOST_ALLOWLIST variable it replaces — a variable is
    # something a run can be talked into changing, a parameter is not.
    #
    # ADMINISTRATOR ACTION REQUIRED: this list ships empty because the Babylon
    # deployment host is not public and therefore cannot be committed by anyone
    # without access to the BabylonJS-Deployment group. Until it is filled in:
    #   * PR-reachable uploads (requireHostAllowlist: true) REFUSE to run. They
    #     are all `continueOnError: true`, so PR builds stay green and only lose
    #     their preview links.
    #   * Trusted master-only uploads fall back to the DEPLOY_HOST_ALLOWLIST
    #     variable, which is safe there because those jobs run no repository
    #     code — see the security contract above.
    # Add the host to BOTH this list and the identical one in
    # upload-test-report.yml; a unit test asserts the two stay in step.
    - name: allowedDeployHosts
      type: object
      default: []
    # When false, upload the site but skip the PR comment. Used by non-PR
    # pipelines (e.g. the npm-publish versioned playground) where there is no
    # System.PullRequest context to comment on.
    - name: postComment
      type: boolean
      default: true
    # Storage account to upload to. Defaults to the report storage account; the
    # playground snapshot jobs override this with the tools storage account so
    # their sites serve from the playground subdomain.
    - name: storageAccount
      type: string
      default: $(STORAGE_ACCOUNT)
    # Public URL to link in the PR comment. Callers pass this explicitly because
    # the served URL can't always be derived from the upload path (e.g. the tools
    # account strips its container prefix from the public domain). Only used when
    # postComment is true.
    - name: linkUrl
      type: string
      default: ""
    # CDN purge after upload. Both must be non-empty for the purge to run; the
    # storage hosts that serve build artifacts are uncached and need none.
    - name: cdnEndpoint
      type: string
      default: ""
    - name: cdnProfile
      type: string
      default: ""
    # True for any call site that a pull-request build can reach. The
    # compile-time host allowlist is then the only permitted source of
    # destination hosts, and an empty one aborts the upload rather than falling
    # back to a runtime variable.
    - name: requireHostAllowlist
      type: boolean
      default: false
    # PR previews are advisory, so a failed upload must not redden a PR build.
    # A master deployment is not advisory: those call sites pass false so a
    # refused or failed upload fails the pipeline instead of passing silently.
    - name: continueOnError
      type: boolean
      default: true

steps:
    - script: |
          set -euo pipefail

          SITE_DIR="${{ parameters.siteDir }}"
          DEPLOY_PATH="${{ parameters.deployPath }}"
          ARCHIVE="$(Build.ArtifactStagingDirectory)/_static_site.zip"
          trap 'rm -f "$ARCHIVE"' EXIT

          # Allowlist of every destination this template is permitted to write.
          # Anything else -- including a destination smuggled in through a
          # runtime variable override -- is refused rather than uploaded.
          ALLOWED_PATH_RE='^(lite/[A-Za-z0-9._-]+/lab|lite/bundle-baseline(/[0-9a-f]{40})?|litePlayground|litePlayground/v|litePlayground/pr/[0-9]+|litePlayground/v/[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?|cdn/website/lite-demos)$'

          case "$DEPLOY_PATH" in
              *..*)
                  echo "Refusing upload: deploy path '$DEPLOY_PATH' contains a parent-directory segment."
                  exit 1
                  ;;
          esac

          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq "$ALLOWED_PATH_RE"; then
              echo "Refusing upload: deploy path '$DEPLOY_PATH' is not in the allowlist."
              echo "Permitted destinations: lite/<build>/lab, lite/bundle-baseline[/<sha>], litePlayground[/v], litePlayground/pr/<number>, litePlayground/v/<version>, cdn/website/lite-demos."
              exit 1
          fi

          # An unresolved ADO macro arrives as literal text rather than an empty
          # string, so an emptiness test alone is not sufficient.
          for name in DEPLOYMENT_SERVER DEPLOY_ENDPOINT_UPLOAD STORAGE_ACCOUNT; do
              value="${!name-}"
              if test -z "$value"; then
                  echo "Refusing upload: required deploy variable $name is empty."
                  exit 1
              fi
              case "$value" in
                  *'$'*)
                      echo "Refusing upload: required deploy variable $name did not resolve."
                      exit 1
                      ;;
              esac
          done

          if test -z "${DEPLOY_TOKEN-}"; then
              echo "Refusing upload: DEPLOY_TOKEN is missing."
              exit 1
          fi

          # The destination must be a bare https origin. Userinfo ('user@host')
          # and a path prefix are rejected because either can silently relocate
          # the request -- and with it the Authorization header -- elsewhere.
          case "$DEPLOYMENT_SERVER" in
              https://*) ;;
              *)
                  echo "Refusing upload: DEPLOYMENT_SERVER must use https."
                  exit 1
                  ;;
          esac

          # Reject anything that could move the request -- and with it the
          # Authorization header -- to a different host: embedded userinfo
          # ('https://real-host@attacker/'), or a host containing characters
          # that are not valid in a hostname or port.
          DEPLOY_HOST="${DEPLOYMENT_SERVER#https://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          case "$DEPLOY_HOST" in
              "" | *[!A-Za-z0-9.:-]*)
                  echo "Refusing upload: DEPLOYMENT_SERVER host is empty or contains characters that are not permitted in a host."
                  exit 1
                  ;;
          esac

          # "It is https" is not a destination check -- an attacker's host serves
          # https too, and neither is a *variable* holding the allowlist: a
          # variable is something a run can be talked into changing, whether by
          # `##vso[task.setvariable]` from an earlier step or by a queue-time
          # override. COMPILE_TIME_HOSTS is rendered from the template parameter
          # `allowedDeployHosts` when the run is compiled, before any step
          # exists, so nothing that happens during the run can add to it.
          COMPILE_TIME_HOSTS="${{ join(' ', parameters.allowedDeployHosts) }}"
          REQUIRE_HOST_ALLOWLIST="${{ parameters.requireHostAllowlist }}"

          if test -n "$COMPILE_TIME_HOSTS"; then
              ALLOWLIST="$COMPILE_TIME_HOSTS"
              ALLOWLIST_SOURCE="the compile-time allowedDeployHosts parameter"
          elif test "$REQUIRE_HOST_ALLOWLIST" = "True" || test "$REQUIRE_HOST_ALLOWLIST" = "true"; then
              # PR-reachable call site with nothing pinned at compile time. A
              # runtime variable is not an acceptable substitute here, so refuse.
              echo "Refusing upload: allowedDeployHosts is empty and this call site may be reached by a pull-request build."
              echo "A pull-request-reachable upload may only send DEPLOY_TOKEN to a host pinned at compile time."
              echo "Add the deployment host to the allowedDeployHosts default in config/templates/upload-static-site.yml"
              echo "and config/templates/upload-test-report.yml, in a pull request merged to master."
              exit 1
          else
              # Trusted master-only call site: this job runs no repository code
              # (see the security contract at the top of this file), so nothing
              # in it can rewrite the variable. Kept as a migration path until
              # allowedDeployHosts is filled in.
              ALLOWLIST="${DEPLOY_HOST_ALLOWLIST-}"
              case "$ALLOWLIST" in
                  *'$'*) ALLOWLIST="" ;;
              esac
              ALLOWLIST_SOURCE="the DEPLOY_HOST_ALLOWLIST variable"
              if test -z "$ALLOWLIST"; then
                  echo "##vso[task.logissue type=warning]allowedDeployHosts is empty and DEPLOY_HOST_ALLOWLIST is unset; this upload's destination is unpinned. Add the deployment host to allowedDeployHosts in config/templates/upload-static-site.yml."
                  ALLOWLIST=""
              fi
          fi

          if test -n "$ALLOWLIST"; then
              HOST_ALLOWED="false"
              for allowed in $(printf '%s' "$ALLOWLIST" | tr ',' ' '); do
                  if test "$DEPLOY_HOST" = "$allowed"; then
                      HOST_ALLOWED="true"
                  fi
              done
              if test "$HOST_ALLOWED" != "true"; then
                  echo "Refusing upload: DEPLOYMENT_SERVER host '$DEPLOY_HOST' is not in $ALLOWLIST_SOURCE."
                  exit 1
              fi
          fi

          # These become multipart/form-data field values, so keep them to
          # characters that cannot forge part boundaries or additional fields.
          for name in DEPLOY_ENDPOINT_UPLOAD STORAGE_ACCOUNT; do
              case "${!name}" in
                  *[!A-Za-z0-9._/-]*)
                      echo "Refusing upload: $name contains characters that are not permitted in a request field."
                      exit 1
                      ;;
              esac
          done

          if ! test -d "$SITE_DIR"; then
              echo "No static site directory found at $SITE_DIR"
              exit 1
          fi

          (cd "$SITE_DIR" && zip -q -r "$ARCHIVE" .)

          # CDN purge target. Both are compile-time parameters, so they are fixed
          # before the run starts; validated anyway because they are interpolated
          # into a query string.
          CDN_ENDPOINT="${{ parameters.cdnEndpoint }}"
          CDN_PROFILE="${{ parameters.cdnProfile }}"
          for value in "$CDN_ENDPOINT" "$CDN_PROFILE"; do
              case "$value" in
                  *[!A-Za-z0-9._-]*)
                      echo "Refusing upload: CDN endpoint/profile contains characters that are not permitted in a query parameter."
                      exit 1
                      ;;
              esac
          done

          if test -n "$CDN_ENDPOINT" && test -n "$CDN_PROFILE"; then
              set -- -F "cdnEndpoint=${CDN_ENDPOINT}" -F "cdnProfile=${CDN_PROFILE}"
          else
              set --
          fi

          # DEPLOY_TOKEN is read from the environment rather than macro-expanded,
          # so the secret is never written into the generated script body, and it
          # reaches curl on stdin as a config file rather than in argv. An
          # argument is not a private channel: it sits in the process's own
          # /proc/<pid>/cmdline for the life of the call, readable by every
          # process running as the same user on the agent, it is what `ps` prints,
          # and agent diagnostics collect it. Log masking does not touch any of
          # that. `--config -` takes the same `header =` setting `-H` does.
          #
          # The escaping is required because a curl config value is a quoted
          # string: a token containing a backslash or a double quote would
          # otherwise end the value early and send a truncated header.
          #
          # --proto '=https' and --location-trusted's absence keep the
          # Authorization header on the host validated above: curl does not
          # follow redirects unless asked, and cannot be talked down to plain
          # http by the server's response.
          token_escaped=${DEPLOY_TOKEN//\\/\\\\}
          token_escaped=${token_escaped//\"/\\\"}

          printf 'header = "Authorization: %s"\n' "$token_escaped" |
          curl "${DEPLOYMENT_SERVER}/${DEPLOY_ENDPOINT_UPLOAD}" --config - --fail-with-body --silent --show-error -X POST \
            --proto '=https' --max-time 600 \
            -H "Content-Type: multipart/form-data" \
            -F "path=${DEPLOY_PATH}" \
            -F "storageAccount=${STORAGE_ACCOUNT}" \
            "$@" \
            -F "zip=@${ARCHIVE}"

          # Purge the CDN in the same step, against the same validated host, so
          # a caller cannot aim the purge somewhere the upload was not allowed.
          # The emitter is repeated rather than hoisted into a helper on purpose:
          # the guard in tests/lite/unit/pipeline-secret-hygiene.test.ts reads the
          # header and the `--config -` that consumes it as one logical command,
          # and a helper would put the two on opposite sides of a function call
          # where nothing can check that they still belong together.
          if test -n "$CDN_ENDPOINT" && test -n "$CDN_PROFILE"; then
              printf 'header = "Authorization: %s"\n' "$token_escaped" |
              curl "${DEPLOYMENT_SERVER}/${DEPLOY_ENDPOINT_PURGE}?endpoint=${CDN_ENDPOINT}&profileName=${CDN_PROFILE}" \
                --config - --fail-with-body --silent --show-error -X POST \
                --proto '=https' --max-time 600
          fi
      condition: succeeded()
      continueOnError: ${{ parameters.continueOnError }}
      displayName: "Upload ${{ parameters.siteName }} static site"
      env:
          DEPLOYMENT_SERVER: $(DEPLOYMENT_SERVER)
          DEPLOY_ENDPOINT_UPLOAD: $(DEPLOY_ENDPOINT_UPLOAD)
          DEPLOY_ENDPOINT_PURGE: $(DEPLOY_ENDPOINT_PURGE)
          DEPLOY_TOKEN: $(DEPLOY_TOKEN)
          DEPLOY_HOST_ALLOWLIST: $(DEPLOY_HOST_ALLOWLIST)
          STORAGE_ACCOUNT: ${{ parameters.storageAccount }}

    - ${{ if eq(parameters.postComment, true) }}:
          - task: GitHubComment@0
            condition: succeeded()
            continueOnError: true
            displayName: "Post ${{ parameters.siteName }} site link to PR"
            inputs:
                gitHubConnection: "BabylonBotPAT"
                repositoryName: "$(Build.Repository.Name)"
                id: "$(System.PullRequest.PullRequestNumber)"
                comment: |
                    ### ${{ parameters.siteName }} - Static Site

                    [Open deployed site](${{ parameters.linkUrl }})

                    <sub>Build $(Build.BuildNumber) - $(Build.SourceBranchName) @ $(Build.SourceVersion)</sub>
