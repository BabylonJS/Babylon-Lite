# Azure Pipelines — Babylon Lite Playground Deployment
#
# Builds the standalone Lite playground (editor + self-hosted "nightly" engine)
# and deploys the generated static site to its own subdomain,
# liteplayground.babylonjs.com, through the Babylon deployment server.
#
# The self-hosted engine bundle is stamped with the latest published version as
# `<version>-nightly` (see playground/vite.engine.config.ts), resolved from the
# newest `npm-lite-v*` git tag — so `fetchDepth: 0` below is required to make the
# tags available. Re-running on each master push (and ideally chained after the
# npm-publish pipeline) keeps nightly tracking the latest release.
#
# Deployment targets the tools storage account (TOOLS_STORAGE_ACCOUNT, from the
# BabylonJS-CI-Infrastructure variable group) under the `litePlayground` path. The
# upload step needs only the storage account + path; the CDN endpoint
# (`lite-playground`) and profile (CDN_PROFILE_TOOLS) are used solely for the
# post-deploy purge.
#
# ── WHY THIS IS TWO JOBS ─────────────────────────────────────────────────────
#
# `pnpm install` and `pnpm build:playground` run repository code, and repository
# code that shares a job with DEPLOY_TOKEN can emit `##vso[task.setvariable]` to
# point DEPLOYMENT_SERVER at a host it controls and collect the token from the
# Authorization header of the upload that follows. The build therefore holds no
# variable group and publishes an artifact; the deploy job starts clean with
# `checkout: none` and never runs repository code.

trigger:
    branches:
        include:
            - master

pr: none

variables:
    - name: NODE_VERSION
      value: "22.x"
    - name: PNPM_VERSION
      value: "11.9.0"
    - name: CI
      value: "true"

stages:
    - stage: DeployPlayground
      displayName: "Deploy Lite Playground"
      jobs:
          # ──────────────────────────────────────────────────────────────
          # Build — repository code, no credentials
          # ──────────────────────────────────────────────────────────────
          - job: Build
            displayName: "Build Lite Playground"
            pool:
                vmImage: "ubuntu-latest"
            steps:
                # fetchDepth: 0 fetches full history + tags so the engine build can
                # resolve the latest npm-lite-v* tag for nightly version stamping.
                - checkout: self
                  fetchDepth: 0

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm build:playground
                  displayName: "Build the playground (engine + app)"

                - script: |
                      set -euo pipefail
                      DIST_DIR="$(System.DefaultWorkingDirectory)/playground/dist"
                      if ! test -d "$DIST_DIR"; then
                        echo "No playground build output found at $DIST_DIR"
                        exit 1
                      fi
                  displayName: "Verify playground build output"

                - task: PublishPipelineArtifact@1
                  displayName: "Stage playground for trusted deploy"
                  inputs:
                      targetPath: $(System.DefaultWorkingDirectory)/playground/dist
                      artifact: playground-dist

          # ──────────────────────────────────────────────────────────────
          # Deploy — credentials, no repository code
          # ──────────────────────────────────────────────────────────────
          - job: Deploy
            displayName: "Deploy Lite Playground"
            dependsOn: Build
            # Exact full ref, and a reason that is not a pull request — see the
            # identical condition in azure-pipelines-demos.yml. A manual queue
            # can name any ref; only a server-side branch-control check on
            # BabylonJS-Deployment stops that ref's own YAML from removing this.
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
            pool:
                vmImage: "ubuntu-latest"
            variables:
                - group: BabylonJS-Deployment
                # Provides TOOLS_STORAGE_ACCOUNT (tools storage account) and
                # CDN_PROFILE_TOOLS (CDN profile backing the tools subdomain).
                - group: BabylonJS-CI-Infrastructure
            steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: "Download playground"
                  inputs:
                      artifact: playground-dist
                      path: $(Pipeline.Workspace)/playground-dist

                - template: config/templates/upload-static-site.yml
                  parameters:
                      siteDir: $(Pipeline.Workspace)/playground-dist
                      deployPath: litePlayground
                      storageAccount: $(TOOLS_STORAGE_ACCOUNT)
                      siteName: "Lite Playground"
                      cdnEndpoint: lite-playground
                      cdnProfile: $(CDN_PROFILE_TOOLS)
                      postComment: false
                      continueOnError: false
