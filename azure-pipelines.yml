# Azure Pipelines — Babylon Lite PR CI (entry point only)
#
# This file deliberately contains no job, no variable group, no service
# connection and no script. It exists to name the trigger and to hand the run to
# `config/templates/pr-ci.yml` read from `refs/heads/master`.
#
# ── WHY ──────────────────────────────────────────────────────────────────────
#
# Azure reads this file from the pull request being validated, not from master:
#
#   "the YAML file that is used to run the pipeline is also a merge between the
#    source and the target branch. As a result, the changes you make to the YAML
#    file in source branch of the pull request can override the behavior defined
#    by the YAML file in target branch."
#   — learn.microsoft.com/azure/devops/pipelines/repos/github#pr-triggers
#
# and there is no setting that changes that. So anything written here is written
# by the author of the pull request under review. Every job definition — which
# job holds which credential, which job runs `checkout: none`, where an upload is
# pointed — therefore lives in the template below, behind a repository resource
# pinned to master. Repository resources are resolved from their pinned ref, so
# the jobs that run are the reviewed, merged ones regardless of the branch that
# queued the build.
#
# A pull request can of course delete the `extends:` line and write its own jobs.
# That is what the server-side **Required template** check is for: configured on
# each protected resource by an administrator, not expressible in YAML, and
# evaluated before a stage starts. A run that does not extend
# `config/templates/pr-ci.yml` from `refs/heads/master` is refused every variable
# group and every service connection — so the tampered run still builds, but with
# nothing worth stealing. TESTING.md ("CI/CD Secret Handling") lists every check
# an administrator must configure; they are the half of this design that no file
# in this repository can assert.
#
# ── CHANGING CI ──────────────────────────────────────────────────────────────
#
# Because the template is pinned, edits to `config/templates/pr-ci.yml` take
# effect only once they are on master. To try a change before merging it, queue a
# manual run of this pipeline from your branch with the `trusted` resource's ref
# overridden to that branch — a manual run is not a pull-request run, so it is
# subject to the same checks and grants no additional access.

trigger: none

pr:
    branches:
        include:
            - master

resources:
    repositories:
        # The same repository this pipeline lives in, pinned to master, so the
        # template below is read from a reviewed ref rather than from the pull
        # request. `endpoint` must name a GitHub service connection with read
        # access to this repository; `ref` must stay a protected branch.
        - repository: trusted
          type: github
          name: BabylonJS/Babylon-Lite
          endpoint: BabylonBotPAT
          ref: refs/heads/master

extends:
    template: config/templates/pr-ci.yml@trusted
