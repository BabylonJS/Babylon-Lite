# Azure Pipelines — Babylon Lite PR CI (entry point only)
#
# This file deliberately contains no job, no variable group, no script and no
# credentialed service connection. It names the trigger and hands the run to
# `config/templates/pr-ci.yml` read from `refs/heads/master`.
#
# ── WHY ──────────────────────────────────────────────────────────────────────
#
# Azure reads this file from the pull request being validated, not from master:
#
#   "the YAML file that is used to run the pipeline is also a merge between the
#    source and the target branch. As a result, the changes you make to the YAML
#    file in source branch of the pull request can override the behavior defined
#    by the YAML file in target branch."
#   — learn.microsoft.com/azure/devops/pipelines/repos/github#pr-triggers
#
# and there is no setting that changes that. So anything written here is written
# by the author of the pull request under review. Every job definition — which
# job runs `checkout: none`, which suite runs at all — therefore lives in the
# template below, behind a repository resource pinned to master. Repository
# resources are resolved from their pinned ref, so the jobs that run are the
# reviewed, merged ones regardless of the branch that queued the build.
#
# ── WHY THAT IS NOT THE LOAD-BEARING PART ────────────────────────────────────
#
# A pull request can delete the `extends:` line and write its own jobs, and no
# file in this repository can stop it. Pipeline authorization is *definition*
# level, not YAML level: any resource this pipeline definition is authorized for
# can be asked for by a job the pull request wrote itself. A required-template
# check is the server-side answer, but it cannot be applied to a resource that
# master pipelines also consume — those declare their stages inline and would be
# refused the resource outright.
#
# So the resources are separated instead of the checks. This definition is
# authorized for exactly one protected resource: `BabylonLite-PRCI-RepoRead`, a
# GitHub service connection with **read** access to this repository and nothing
# else. It exists so the pinned template can be fetched. A pull request that
# rewrites this file and asks for it gets read access to a repository it is
# already reading — there is nothing here to steal, which is the property that
# makes the check regime consistent rather than aspirational.
#
# Every credential — `BabylonJS-Deployment`, `BabylonJS-CI-Infrastructure`,
# `BabylonJS-BrowserStack`, `BabylonJS-NpmPublish`, `BabylonBotPAT` — is
# master-only, carries a branch-control check, and must NOT be authorized for
# this definition. TESTING.md ("Protected resource matrix") is the full list.
#
# PR previews and PR comments are produced from artifacts this run stages, by
# `azure-pipelines-pr-publish.yml`, which is a separate, master-only definition.
#
# ── CHANGING CI ──────────────────────────────────────────────────────────────
#
# Because the template is pinned, edits to `config/templates/pr-ci.yml` take
# effect only once they are on master. To try a change before merging it, queue a
# manual run of this pipeline from your branch with the `trusted` resource's ref
# overridden to that branch — a manual run is not a pull-request run, so it is
# subject to the same checks and grants no additional access.

trigger: none

pr:
    branches:
        include:
            - master

resources:
    repositories:
        # The same repository this pipeline lives in, pinned to master, so the
        # template below is read from a reviewed ref rather than from the pull
        # request.
        #
        # `endpoint` must name a GitHub service connection whose PAT is scoped to
        # **read** this repository — no contents write, no issue/PR write, no
        # deployment. It is the only protected resource a pull-request build
        # touches, and it is deliberately NOT `BabylonBotPAT`: that connection can
        # comment and tag, is consumed by the master-only publish pipelines, and a
        # resource shared with them could not carry the required-template check
        # this one does. `ref` must stay a protected branch.
        - repository: trusted
          type: github
          name: BabylonJS/Babylon-Lite
          endpoint: BabylonLite-PRCI-RepoRead
          ref: refs/heads/master

extends:
    template: config/templates/pr-ci.yml@trusted
