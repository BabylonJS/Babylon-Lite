# Azure Pipelines — Babylon Lite CI
#
# Runs on every PR targeting master, AND on every push to master. Nine jobs:
#
#   Job                     PR   master   Notes
#   ─────────────────────── ──── ──────── ───────────────────────────────────────
#   0 Release Markers       yes  no       breaking-change marker validation
#   1 API Report            yes  no       public API diff comment + validation
#   2 Unit Tests            yes  yes      vitest + plumbing (Playwright)
#   3 Bundle Size           yes  no       ceiling checks + delta report
#   4 Perf Regression       yes  no       Lite vs Stable on BrowserStack
#   5 Parity (Cloud)        yes  no       pixel-diff on a real-WebGPU cloud browser
#   6 Lint & Type Check     yes  yes      ESLint + TypeScript type-check
#   7 Compat Layer          yes  yes      @babylonjs/lite-compat build + tests
#   8 Playground Snapshot   yes  no       per-PR playground deploy + PR comment
#
# ── Why this also runs on master ──────────────────────────────────────────────
#
# Azure DevOps builds the *merge commit* for a PR, not the PR head. That is the
# right thing to validate, but it means a PR's green build only proves that the
# branch was good against master *as it stood when the build ran*. Two PRs can
# each be green against that snapshot, both merge, and interact badly — a
# semantic conflict that neither build could have seen (a renamed export plus a
# new caller of the old name; a tightened invariant plus new code that violates
# it; two independently-correct edits to the same behaviour).
#
# Without a master trigger nothing notices. The breakage surfaces on the *next*
# PR's build, which goes red for something it did not do, and that author spends
# their afternoon bisecting somebody else's merge. Worst case it survives to the
# weekly npm publish and ships.
#
# So master pushes run the deterministic gates — Unit Tests, Lint & Type Check,
# and Compat Layer. Those three are hermetic (no cloud browser, no external
# service), which matters more than coverage here: a post-merge failure has no
# author to nudge and no PR to block, so it is only useful if a red run reliably
# means "master is broken" rather than "BrowserStack was busy". They finish in
# parallel in roughly 11 minutes, dominated by Unit Tests.
#
# The expensive, externally-dependent suites (Bundle Size, Perf, Parity) stay
# PR-only. They cost 40-55 minutes each and are flaky in ways that would make a
# post-merge signal noise rather than information. Bundle-size ceilings are
# separately enforced on every master push by azure-pipelines-bundle-manifest.yml,
# which runs `pnpm build:bundle-scenes` and checks `maxRawKB` byte-exactly —
# that pipeline lands with PR #526, and until it does, master carries no
# bundle-ceiling enforcement. Adding a 42-minute job here is not the fix for
# that; landing #526 is.
#
# ── Rule for anyone adding a job here ─────────────────────────────────────────
#
# A job that reads PR context CANNOT run on a master build. There is no PR, so
# `System.PullRequest.PullRequestNumber` is empty and anything derived from it
# (a GitHubComment@0 target, a per-PR deploy path, a PR title/label lookup) is
# either a no-op or an error. Every such job MUST carry:
#
#     condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
#
# `Build.SourceBranch` is `refs/pull/<n>/merge` on a PR build and
# `refs/heads/master` on a master push, so this skips the job exactly when the
# thing being built *is* master. It is deliberately not `eq(Build.Reason,
# 'PullRequest')`: that would also skip the job on a manual queue against a
# feature branch, which is a real workflow (queueing a parity or perf run
# on-demand) and one this pipeline has always supported.
#
# The `succeeded()` half is not decoration. Declaring any `condition:` on a job
# REPLACES the implicit default of `succeeded()`. Every job here is currently
# independent (no `dependsOn` anywhere in this file), so a bare `ne(...)` would
# behave identically today — but the moment someone adds a `dependsOn` to a
# gated job, a bare condition would silently let it run even when its dependency
# failed. Spelling out `succeeded()` costs nothing and removes that trap.
#
# Jobs without that condition run in BOTH contexts, so they must not touch PR
# variables at all.
#
# ── Do not add path filters to the master trigger ─────────────────────────────
#
# The trigger below deliberately has no `paths:` filter, so master validation
# also runs on doc-only and comment-only commits. That is mildly wasteful —
# ~11 minutes across three agents — and the waste is accepted on purpose.
#
# A path filter is precisely the optimisation that lets a real break slip
# through unvalidated. The failure mode is not hypothetical: the filter has to
# encode which paths can affect a build, that list is wrong the moment someone
# adds a config file, a script, a tsconfig `include`, or a generated-doc check
# that reads source (this repo has one — `pnpm gen:feature-doc:check` in the
# Lint job compares docs/lite/02-feature-comparison.md against lab HTML). A
# "docs-only" commit then merges unvalidated, and the next PR eats the red
# build — which is the exact problem this trigger exists to solve.
#
# If the cost ever genuinely matters, batch the trigger (`batch: true`) rather
# than filtering paths. That reduces the number of runs without ever letting a
# commit through unvalidated.

trigger:
    branches:
        include:
            - master

pr:
    branches:
        include:
            - master

variables:
    - group: BabylonJS-BrowserStack
    - group: BabylonJS-Deployment
    # Provides TOOLS_STORAGE_ACCOUNT — the tools storage account backing
    # liteplayground.babylonjs.com, so PR playground snapshots serve same-origin
    # as nightly (required by the client-side deploy coordinator).
    - group: BabylonJS-CI-Infrastructure
    - name: NODE_VERSION
      value: "22.x"
    - name: PNPM_VERSION
      value: "11.9.0"
    - name: CI
      value: "true"
    - name: HEADLESS
      value: "true"

stages:
    - stage: CI
      displayName: "Validation"
      jobs:
          # ──────────────────────────────────────────────────────────────
          # Job 0: Release Marker Validation
          # ──────────────────────────────────────────────────────────────
          # PR-only. This job's entire subject is the pull request: it reads the
          # PR title, body, and labels to decide whether a breaking change was
          # declared. On a master build there is no PR to inspect, so the check
          # has nothing to validate.
          - job: ReleaseMarkers
            displayName: "Release Markers"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm validate:release-markers
                  displayName: "Validate breaking-change markers"
                  env:
                      GITHUB_REPOSITORY: "BabylonJS/Babylon-Lite"
                      PR_NUMBER: "$(System.PullRequest.PullRequestNumber)"
                      GITHUB_TOKEN: "$(GITHUB_TOKEN)"

          # ──────────────────────────────────────────────────────────────
          # Job 1: API Report
          # ──────────────────────────────────────────────────────────────
          # PR-only, and deliberately so even though it looks deterministic
          # enough to run post-merge. Two independent reasons:
          #
          #   * The diff is empty by construction on master. The baseline is
          #     built from `git merge-base HEAD origin/master`
          #     (scripts/report-api-changes.ts) — on a master build that merge
          #     base IS HEAD, so the report always says "no public API changes",
          #     POST_API_COMMENT is always false, and the breaking-marker check
          #     can never fire. It would spend ~2 minutes building the package
          #     twice (the baseline worktree runs its own `pnpm install`) to
          #     assert nothing.
          #   * The only signal left after removing the diff — "the publishable
          #     package builds and its trimmed index.d.ts is clean" — is already
          #     covered on master by the Unit Tests job, whose `--project build`
          #     suite runs `vite build --mode lib` and `--mode dist` and then
          #     type-checks build/index.d.ts
          #     (tests/lite/build/public-api-types.test.ts, bundler-harness.ts).
          #
          # It also posts a PR comment, which needs a PR number. Please do not
          # "restore" this on master without a reason that survives both points.
          - job: ApiReport
            displayName: "API Report"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0
                  persistCredentials: true

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm report:api-changes
                  displayName: "Generate API report diff"
                  env:
                      GITHUB_REPOSITORY: "BabylonJS/Babylon-Lite"
                      PR_NUMBER: "$(System.PullRequest.PullRequestNumber)"
                      GITHUB_TOKEN: "$(GITHUB_TOKEN)"

                - task: GitHubComment@0
                  # The branch guard is redundant with the job-level condition
                  # above and is kept deliberately: a GitHubComment@0 whose `id`
                  # is an empty PR number fails in a confusing way, so the guard
                  # stays local to the task that would break.
                  condition: and(always(), eq(variables['POST_API_COMMENT'], 'true'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
                  continueOnError: true
                  displayName: "Post API changes to PR"
                  inputs:
                      gitHubConnection: "BabylonBotPAT"
                      repositoryName: "$(Build.Repository.Name)"
                      id: "$(System.PullRequest.PullRequestNumber)"
                      comment: "$(API_COMMENT_BODY)"

          # ──────────────────────────────────────────────────────────────
          # Job 2: Unit Tests
          # ──────────────────────────────────────────────────────────────
          # Runs on PRs AND on master. Hermetic (headless Chromium/SwiftShader,
          # no cloud browser, no external service), so a red run here means the
          # code is broken rather than that an outside service was having a bad
          # day — the property a post-merge gate needs to be actionable. At
          # ~11 minutes it is the longest of the three master jobs and therefore
          # sets the post-merge wall time.
          #
          # It also carries the package build: `--project build` runs
          # `vite build --mode lib` and `--mode dist`, which is why the API
          # Report job is not needed on master (see Job 1).
          #
          # Touches no PR variables — keep it that way.
          - job: UnitTests
            displayName: "Unit Tests"
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm exec playwright install chromium
                  displayName: "Install Playwright browsers"

                - script: npx vitest run --project unit --project gl-unit --project no-webgpu
                  displayName: "Run vitest unit tests"
                  env:
                      CI: "true"

                - script: npx vitest run --project build
                  displayName: "Run vitest build-output tests"

                - script: npx vitest run --project gl-build
                  displayName: "Run vitest lite-gl build-output tests"

                # lite-gl visual parity vs the Babylon ThinEngine reference. WebGL2
                # runs headless (SwiftShader in CI, enabled by CI=true in
                # playwright.config.ts), so no cloud browser is needed — unlike the
                # WebGPU parity job below. Compares the live lite-gl render against the
                # committed goldens in reference/gl/<slug>/babylon-ref-golden.png; those
                # goldens MUST be generated with the same SwiftShader path
                # (CI=true HEADLESS=true RECAPTURE_GOLDEN=true pnpm test:parity:gl) so
                # the renderer matches. If a golden is missing the harness self-captures
                # it live (the run still passes, but without a reviewed baseline).
                - script: pnpm test:parity:gl
                  displayName: "Run lite-gl parity tests"
                  env:
                      HEADLESS: "true"
                      CI: "true"

                # lite-gl perf vs the Babylon ThinEngine it replaces (same headless
                # SwiftShader render — no cloud browser needed, and no committed golden
                # required since both engines render live). Gates that lite-gl is not
                # materially slower than Babylon; a generous margin absorbs CI software-
                # rendering noise (where the lite-gl/Babylon ratio compresses) while
                # still catching a gross regression. Writes the Perf-Regression manifest.
                - script: pnpm test:perf-regression:gl
                  displayName: "Run lite-gl perf regression"
                  env:
                      HEADLESS: "true"
                      CI: "true"
                      PERF_DURATION: "3"
                      PERF_REGRESSION_PCT: "50"

                - script: |
                      npx playwright test tests/lite/plumbing/dispose.spec.ts
                      npx playwright test tests/lite/plumbing/material-swap.spec.ts
                      npx playwright test tests/lite/plumbing/memory-leak.spec.ts
                      npx playwright test tests/lite/plumbing/picking.spec.ts
                  displayName: "Run plumbing tests"
                  env:
                      HEADLESS: "true"

                - task: PublishTestResults@2
                  condition: always()
                  inputs:
                      testResultsFormat: "JUnit"
                      testResultsFiles: "**/test-results/unit-junit.xml"
                      mergeTestResults: true
                      testRunTitle: "Unit Tests"
                  continueOnError: true

                - script: npx tsx scripts/report-test-results.ts test-results/unit-junit.xml
                  condition: always()
                  continueOnError: true
                  displayName: "Report test results"

          # ──────────────────────────────────────────────────────────────
          # Job 3: Bundle Size
          # ──────────────────────────────────────────────────────────────
          # PR-only. Two reasons, either of which is sufficient:
          #
          #   * It is already covered on master. azure-pipelines-bundle-manifest.yml
          #     runs on every master push and measures every scene with
          #     `pnpm build:bundle-scenes`, which enforces the per-scene
          #     `maxRawKB` ceilings from scene-config.json byte-exactly (that
          #     pipeline lands with PR #526). Duplicating it here would add
          #     ~42 minutes for a second opinion on the same numbers.
          #   * The delta half is inherently PR-scoped — it diffs against the
          #     published master baseline and reports the result as a PR comment,
          #     which needs a PR number. On master the "delta" would be the
          #     baseline against itself.
          - job: BundleSize
            displayName: "Bundle Size"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  persistCredentials: true

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm exec playwright install chromium
                  displayName: "Install Playwright browsers"

                # Cache remote scene assets (models/textures/env fetched during
                # measurement) across runs/PRs. The cache is a pure URL->bytes store
                # independent of source, so a constant prefix is shared broadly. The
                # per-run key component means the exact key never hits (so newly
                # fetched assets are always saved at job end), while restoreKeys
                # restores the most recent prefix match — a rolling cache that
                # accumulates new assets instead of freezing. Measurement still
                # fetches-with-retry on a miss, so a cold/expired cache is only slower,
                # never incorrect.
                - task: Cache@2
                  displayName: "Cache remote scene assets"
                  inputs:
                      key: 'bundle-assets | v1 | "$(Build.BuildId)"'
                      restoreKeys: |
                          bundle-assets | v1
                      path: $(System.DefaultWorkingDirectory)/.bundle-asset-cache

                - script: |
                      TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-refs/heads/master}"
                      TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"
                      git fetch origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" --depth=1
                  displayName: "Fetch master bundle baseline"

                - script: pnpm build:bundle-scenes
                  displayName: "Build bundle scenes"
                  env:
                      SKIP_BJS: "true"

                # Enforce that any PR which moves per-scene bundle sizes also
                # commits the regenerated per-scene manifest files. The build step
                # above rewrites the working-tree per-scene manifest with fresh
                # measurements; this compares them (rounded to whole KB) against the
                # versions committed at HEAD.
                - script: pnpm validate:bundle-manifest
                  displayName: "Validate bundle manifest is committed"

                # Absolute ceiling checks (scene-config.json maxRawKB)
                - script: npx playwright test tests/lite/parity/bundle-size.spec.ts --reporter=junit
                  displayName: "Bundle size ceiling checks"
                  env:
                      HEADLESS: "true"
                      PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/bundle-ceiling-junit.xml

                - script: npx tsx scripts/report-test-results.ts test-results/bundle-ceiling-junit.xml
                  condition: always()
                  displayName: "Report bundle-size results to Azure"

                - task: PublishTestResults@2
                  condition: always()
                  displayName: "Publish bundle-size test results"
                  inputs:
                      testResultsFormat: JUnit
                      testResultsFiles: "test-results/bundle-ceiling-junit.xml"
                      testRunTitle: "Bundle Size"

                # Generate bundle-size delta comment for PR
                - script: npx tsx scripts/report-bundle-size-deltas.ts
                  condition: always()
                  displayName: "Generate bundle-size delta comment"

                - task: GitHubComment@0
                  # See the equivalent guard in Job 1: redundant with the
                  # job-level condition, kept local to the task that an empty PR
                  # number would break.
                  condition: and(always(), eq(variables['POST_BUNDLE_COMMENT'], 'true'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
                  continueOnError: true
                  displayName: "Post bundle-size changes to PR"
                  inputs:
                      gitHubConnection: "BabylonBotPAT"
                      repositoryName: "$(Build.Repository.Name)"
                      id: "$(System.PullRequest.PullRequestNumber)"
                      comment: "$(BUNDLE_COMMENT_BODY)"

                - script: pnpm build:lab-site
                  displayName: "Build static lab site"
                  env:
                      LAB_BASE_PATH: "/lite/$(Build.BuildNumber)/lab/"

                - template: config/templates/upload-static-site.yml
                  parameters:
                      siteDir: $(System.DefaultWorkingDirectory)/lab/dist
                      deployPath: lite/$(Build.BuildNumber)/lab
                      siteName: "Lab"
                      linkUrl: $(SERVE_DOMAIN)/lite/$(Build.BuildNumber)/lab/index.html

          # ──────────────────────────────────────────────────────────────
          # Job 4: Performance Regression
          # ──────────────────────────────────────────────────────────────
          # PR-only. ~53 minutes on BrowserStack, comparing this build against a
          # rebuilt stable baseline. It depends on an external service and on
          # timing measurements taken on shared cloud hardware, so it fails for
          # reasons unrelated to the code often enough that a post-merge run
          # would mostly teach people to ignore master failures — the opposite
          # of what a post-merge gate is for. Its cost is also paid per run, and
          # it would run on every single merge.
          - job: PerfRegression
            displayName: "Performance: Lite vs Stable"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            timeoutInMinutes: 120
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0
                  fetchTags: true

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                # Build current bundle scenes (skip size measurement — not needed for perf)
                - script: pnpm build:bundle-scenes
                  displayName: "Build current bundle scenes"
                  env:
                      SKIP_BJS: "true"
                      SKIP_MEASURE: "true"

                # Resolve baseline ref SHA for cache key.
                # Must mirror getBaselineRef() in scripts/build-perf-baseline.ts so the cache key
                # matches the ref that pnpm build:perf-baseline will actually build from.
                # NOTE: do NOT chain `git describe ... | xargs git rev-parse || fallback` — when
                # `git describe` finds no tag it exits non-zero but xargs still runs `git rev-parse`
                # with no args, which exits 0 with empty stdout, so the `||` fallbacks never fire
                # and BASELINE_SHA silently becomes empty. That corrupts the cache key to a
                # constant string shared across all builds.
                - script: |
                      set -u
                      TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
                      if [ -n "$TAG" ]; then
                          BASELINE_SHA=$(git rev-parse "$TAG")
                          echo "Baseline ref: $TAG"
                      else
                          BASELINE_SHA=$(git rev-parse origin/master 2>/dev/null || git rev-parse HEAD~1)
                          echo "Baseline ref: origin/master (no v* tag found)"
                      fi
                      if [ -z "$BASELINE_SHA" ]; then
                          echo "##vso[task.logissue type=error]Failed to resolve baseline SHA — aborting to avoid poisoning the perf-baseline cache with an empty key."
                          exit 1
                      fi
                      echo "##vso[task.setvariable variable=BASELINE_SHA]$BASELINE_SHA"
                      echo "Baseline SHA: $BASELINE_SHA"
                      mkdir -p lab/public/bundle-baseline
                  displayName: "Resolve baseline ref"

                - task: Cache@2
                  inputs:
                      key: '"perf-baseline" | "$(BASELINE_SHA)"'
                      path: $(System.DefaultWorkingDirectory)/lab/public/bundle-baseline
                      cacheHitVar: BASELINE_CACHE_HIT
                  displayName: "Cache baseline bundles"

                # Build baseline bundle scenes from last release tag (or master)
                - script: pnpm build:perf-baseline
                  displayName: "Build baseline bundle scenes"
                  condition: ne(variables.BASELINE_CACHE_HIT, 'true')

                # Generate baseline HTML loader pages (needed even on cache hit)
                - script: |
                      node -e "
                      const fs = require('fs');
                      const path = require('path');
                      const scenes = JSON.parse(fs.readFileSync('scene-config.json','utf8'));
                      const outDir = path.join('lab','lite');
                      fs.mkdirSync(outDir, { recursive: true });
                      for (const s of scenes) {
                        const html = '<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id=\"renderCanvas\"></canvas><script src=\"/loader.js\"></script><script type=\"module\" src=\"/bundle-baseline/scene'+s.id+'.js\"></script></body></html>';
                        fs.writeFileSync(path.join(outDir,'bundle-baseline-scene'+s.id+'.html'), html);
                      }
                      console.log('Generated ' + scenes.length + ' baseline HTML pages');
                      "
                  displayName: "Generate baseline HTML pages"
                  condition: eq(variables.BASELINE_CACHE_HIT, 'true')

                # Runs current vs baseline on same BrowserStack macOS Chrome instance
                - script: pnpm test:perf-cloud
                  displayName: "Run perf regression tests (current vs stable)"
                  env:
                      HEADLESS: "true"
                      PERF_REGRESSION_PCT: "$(PERF_REGRESSION_PCT)"
                      PERF_FRAMES: "$(PERF_FRAMES)"
                      PERF_RUNS: "$(PERF_RUNS)"
                      PERF_WARMUP: "$(PERF_WARMUP)"
                      BROWSERSTACK_USERNAME: "$(BROWSERSTACK_USERNAME)"
                      BROWSERSTACK_ACCESS_KEY: "$(BROWSERSTACK_ACCESS_KEY)"

                - task: PublishTestResults@2
                  condition: always()
                  inputs:
                      testResultsFormat: "JUnit"
                      testResultsFiles: "**/test-results/perf-junit.xml"
                      mergeTestResults: true
                      testRunTitle: "Perf Regression"
                  continueOnError: true

                - script: npx tsx scripts/report-test-results.ts test-results/perf-junit.xml
                  condition: always()
                  continueOnError: true
                  displayName: "Report test results"

                - template: config/templates/upload-test-report.yml
                  parameters:
                      reportDir: $(System.DefaultWorkingDirectory)/test-results/perf-report
                      reportType: perf

          # ──────────────────────────────────────────────────────────────
          # Job 5: Parity (Cloud Browser)
          # ──────────────────────────────────────────────────────────────
          # PR-only, for the same reason as Perf: ~37 minutes against a
          # BrowserStack macOS Chrome with real WebGPU. Pixel parity is the
          # project's core guarantee, so excluding it post-merge is a real gap
          # — but a gate that depends on a third-party browser farm is a poor
          # post-merge signal, and running it on every merge would multiply the
          # cloud cost by the merge rate. The lite-gl parity suite still runs
          # post-merge inside Unit Tests, headless on SwiftShader, so the parity
          # harness itself is not entirely unwatched on master.
          - job: ParityCloud
            displayName: "Parity Tests (Cloud Browser)"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            timeoutInMinutes: 180
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm build:bundle-scenes
                  displayName: "Build bundle scenes"
                  env:
                      SKIP_BJS: "true"
                      SKIP_MEASURE: "true"

                # Run parity tests on BrowserStack (macOS Chrome with real WebGPU)
                # via a direct CDP connection — NO browserstack-node-sdk. The wait
                # script grabs up to BSTACK_SESSIONS_REQUIRED parallel sessions and
                # exports CIWORKERS so the specs shard across that many cloud browsers
                # (falling back to fewer when the plan is busy). A BrowserStack Local
                # tunnel (started by the Playwright globalSetup) exposes the local dev
                # server to the remote browser.
                # Requires BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY
                # from the BabylonJS-BrowserStack variable group.
                - script: bash scripts/browserstack-wait.sh pnpm test:parity-cloud
                  displayName: "Run parity tests (BrowserStack, sharded)"
                  env:
                      HEADLESS: "true"
                      BROWSERSTACK_USERNAME: "$(BROWSERSTACK_USERNAME)"
                      BROWSERSTACK_ACCESS_KEY: "$(BROWSERSTACK_ACCESS_KEY)"
                      BSTACK_SESSIONS_REQUIRED: "2"
                      BSTACK_LOCAL_IDENTIFIER: "bstack-lite-parity-$(Build.BuildId)"

                # Scrub BrowserStack credentials from the report/JUnit artifacts
                # before they are published/uploaded. The CDP wsEndpoint embeds the
                # access key and can surface in Playwright error output.
                - script: npx tsx scripts/redact-secrets.ts test-results
                  condition: always()
                  continueOnError: true
                  displayName: "Redact secrets from test artifacts"
                  env:
                      BROWSERSTACK_USERNAME: "$(BROWSERSTACK_USERNAME)"
                      BROWSERSTACK_ACCESS_KEY: "$(BROWSERSTACK_ACCESS_KEY)"

                - task: PublishTestResults@2
                  condition: always()
                  inputs:
                      testResultsFormat: "JUnit"
                      testResultsFiles: "**/test-results/parity-junit.xml"
                      mergeTestResults: true
                      testRunTitle: "Parity (Cloud)"
                  continueOnError: true

                - script: npx tsx scripts/report-test-results.ts test-results/parity-junit.xml
                  condition: always()
                  continueOnError: true
                  displayName: "Report test results"

                - template: config/templates/upload-test-report.yml
                  parameters:
                      reportDir: $(System.DefaultWorkingDirectory)/test-results/parity-report
                      reportType: parity

          # ──────────────────────────────────────────────────────────────
          # Job 6: Lint
          # ──────────────────────────────────────────────────────────────
          # Runs on PRs AND on master. The cheapest post-merge gate that can
          # catch a semantic conflict: a type error is exactly what you get when
          # one PR changes a signature and another adds a caller of the old one,
          # and neither PR's build could have seen the combination. ~2.5 minutes,
          # fully hermetic, touches no PR variables.
          - job: Lint
            displayName: "Lint & Type Check"
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: npx eslint . --format ./scripts/eslint-vso-formatter.cjs
                  displayName: "ESLint"

                - script: |
                      npx tsc -p packages/babylon-lite/tsconfig.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (package)"

                - script: |
                      npx tsc -p lab/tsconfig.typecheck.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (lab)"

                - script: |
                      npx tsc -p tests/lite/tsconfig.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (tests)"

                - script: |
                      npx tsc -p packages/babylon-lite-gl/tsconfig.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (gl package)"

                - script: |
                      npx tsc -p tests/gl/tsconfig.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (gl tests)"

                # Verifies docs/lite/02-feature-comparison.md is in sync with its
                # source of truth (lab/lite/docs/feature-comparison.html). The check
                # exits non-zero either when the doc is OUT OF SYNC or when generation
                # itself fails (e.g. malformed HTML). On failure, emit a task.logissue
                # so the error surfaces in the ADO build's Errors summary (the GitHub
                # check links here via "Details"); the step log above has the specifics.
                - script: |
                      if ! pnpm gen:feature-doc:check; then
                          echo "##vso[task.logissue type=error;sourcepath=docs/lite/02-feature-comparison.md]Feature-comparison doc check failed (see the step log above for details). If it reports OUT OF SYNC, run 'pnpm gen:feature-doc' and commit the result; otherwise fix the reported generation error."
                          exit 1
                      fi
                  displayName: "Feature-comparison doc in sync"

          # ──────────────────────────────────────────────────────────────
          # Job 7: Compat Layer (@babylonjs/lite-compat)
          # ──────────────────────────────────────────────────────────────
          # Type-checks, builds, and unit-tests the opt-in compatibility layer so
          # regressions are caught in PR CI. NOTE: this job intentionally does NOT
          # publish the package — @babylonjs/lite-compat is not released yet. The
          # npm-publish pipeline only publishes packages/babylon-lite/build.
          #
          # Runs on master too (~2.5 minutes, hermetic, no PR variables). It is
          # the job most exposed to semantic conflicts: the compat layer is a
          # thin shim over the engine's public surface, so an engine change that
          # is internally consistent can still break it, and the engine PR that
          # caused it has no reason to look.
          - job: Compat
            displayName: "Compat Layer"
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: |
                      npx tsc -p packages/babylon-lite-compat/tsconfig.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (compat src)"

                - script: |
                      npx tsc -p packages/babylon-lite-compat/tests/tsconfig.json --noEmit 2>&1 | sed -E 's/^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.+)/##vso[task.logissue type=error;sourcepath=\1;linenumber=\2;columnnumber=\3]\4: \5/'
                  displayName: "TypeScript type-check (compat tests)"

                - script: pnpm --filter @babylonjs/lite-compat build
                  displayName: "Build compat package (dist)"

                - script: npx vitest run --project compat
                  displayName: "Run compat unit tests"
                  env:
                      CI: "true"

                - task: PublishTestResults@2
                  condition: always()
                  inputs:
                      testResultsFormat: "JUnit"
                      testResultsFiles: "**/test-results/unit-junit.xml"
                      mergeTestResults: true
                      testRunTitle: "Compat Layer"
                  continueOnError: true

          # ──────────────────────────────────────────────────────────────
          # Job 8: PR Playground Snapshot
          # ──────────────────────────────────────────────────────────────
          # Builds the Lite Playground from THIS PR's source — the self-hosted
          # engine is bundled from the same commit, so the runner executes the PR's
          # engine code — and deploys it to a per-PR sub-path on the tools account
          # (served at liteplayground.babylonjs.com/pr/<N>/, same origin as nightly),
          # then comments the URL on the PR. PLAYGROUND_BASE is set to match the
          # public sub-path so every asset, the runner iframe, the self-hosted
          # engine, and the SPA snippet routes resolve under it.
          #
          # Fork PRs: Azure withholds secret variables (including the deploy token)
          # from fork-triggered PRs by default, so on a fork the upload step simply
          # no-ops (it is continueOnError) and the PR still passes. To publish
          # snapshots for fork PRs, enable "Make secrets available to builds of
          # forks" in the pipeline's trigger settings — note this exposes the
          # deploy token to fork-authored code, a security trade-off to weigh.
          #
          # PR-only: every variable below is derived from the PR number, and the
          # whole point of the job is a comment on the PR. The master equivalent
          # already exists as a separate pipeline (azure-pipelines-playground.yml),
          # which deploys the nightly playground on each push.
          - job: PlaygroundSnapshot
            displayName: "PR Playground Snapshot"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            pool:
                vmImage: "ubuntu-latest"
            variables:
                # Immutable per-PR snapshot, served same-origin as nightly on the
                # tools account so the deploy coordinator can hand off to it.
                #   deployPath     — upload path inside the tools storage account
                #                    (the `litePlayground` container maps to the
                #                    subdomain root, so this becomes /pr/<N>/).
                #   playgroundBase — public base path baked into the build.
                #   playgroundUrl  — public URL posted in the PR comment.
                - name: deployPath
                  value: litePlayground/pr/$(System.PullRequest.PullRequestNumber)
                - name: playgroundBase
                  value: /pr/$(System.PullRequest.PullRequestNumber)/
                - name: playgroundUrl
                  value: https://liteplayground.babylonjs.com/pr/$(System.PullRequest.PullRequestNumber)/
            steps:
                # fetchDepth: 0 + tags so the engine build can resolve the latest
                # npm-lite-v* tag for its version stamp (see vite.engine.config.ts).
                - checkout: self
                  fetchDepth: 0
                  fetchTags: true

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                # PLAYGROUND_BASE must be leading- and trailing-slashed and match
                # the public sub-path so the built app resolves assets under it.
                - script: pnpm build:playground
                  displayName: "Build the playground (engine + app)"
                  env:
                      PLAYGROUND_BASE: $(playgroundBase)

                - template: config/templates/upload-static-site.yml
                  parameters:
                      siteDir: $(System.DefaultWorkingDirectory)/playground/dist
                      deployPath: $(deployPath)
                      storageAccount: $(TOOLS_STORAGE_ACCOUNT)
                      siteName: "Lite Playground"
                      linkUrl: $(playgroundUrl)
