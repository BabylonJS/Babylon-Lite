# Azure Pipelines — Bundle-Size Baseline
#
# Measures every scene on each push to master and publishes the aggregate
# bundle-size manifest to public storage, where PR builds (and developers) read
# it as the baseline for the "how did this change move bundle sizes" report.
#
# ── Why this exists ───────────────────────────────────────────────────────────
#
# The baseline used to be ~227 JSON files tracked in git and refreshed by PR
# authors. Because nearly every shared-module change moves bytes in most of the
# ~230 scenes, that broke in two ways at once:
#
#   * Red CI — as soon as any shared-code PR merged, every other open PR's
#     committed manifest was stale and its Bundle Size job went red for reasons
#     that had nothing to do with that PR.
#   * Merge conflicts — two branches that both regenerated the manifest rewrote
#     the same ~200 tracked files and collided. In one representative PR, 168 of
#     the 169 conflicting paths were manifest files and none were source.
#
# Both failures come from the same root cause: a generated file living in git on
# branches that have no reason to carry it. Publishing the baseline instead of
# committing it removes the cause rather than managing the symptoms — there is no
# tracked file to go stale and nothing for two branches to collide on.
#
# Publishing (rather than pushing to master) also keeps CI out of the repo's
# write path entirely: master is a protected branch, and the CI identity is
# deliberately not allowed to bypass that protection.
#
# It is safe because the baseline gates nothing. Size regressions are caught by
# the absolute per-scene ceilings in `scene-config.json` (`maxRawKB`), which
# `pnpm build:bundle-scenes` enforces byte-exactly. The baseline only powers the
# advisory delta report, so if it is ever missing or stale the report is skipped
# and no build fails.

# ── WHY THE UPLOAD IS ITS OWN JOB ────────────────────────────────────────────
#
# Measuring ~230 scenes runs repository code and a real browser for the better
# part of an hour: `pnpm install` runs dependency lifecycle scripts, and
# `pnpm build:bundle-scenes` runs the repository's own build. Anything in that
# hour can emit `##vso[task.setvariable]` and rewrite a pipeline variable for
# every later step in the same job — DEPLOYMENT_SERVER included, which is where
# the next step sends DEPLOY_TOKEN in an Authorization header.
#
# The measurement job therefore holds no variable group and no token. It stages
# the baseline as a pipeline artifact, and a separate `checkout: none` job with
# no repository code on it at all performs the authenticated upload.
#
# Preflight runs first, and Measure waits for it, so a missing deploy variable
# still costs seconds rather than the full measurement run — the failure mode
# this pipeline was originally written to avoid.

trigger:
    branches:
        include:
            - master

pr: none

variables:
    - name: NODE_VERSION
      value: "22.x"
    - name: PNPM_VERSION
      value: "11.9.0"
    - name: CI
      value: "true"
    - name: HEADLESS
      value: "true"
    # Public path the baseline is served from. Must stay in sync with
    # DEFAULT_MASTER_MANIFEST_URL in scripts/bundle-scenes-core.ts.
    # The snapshots account is served at $(SERVE_DOMAIN), so this lands at
    # https://snapshots-cvgtc2eugrd3cgfd.z01.azurefd.net/lite/bundle-baseline/manifest.json
    #
    # This is the CI-artifact host that already serves the per-build test reports
    # and lab sites under lite/<BuildNumber>/, rather than the playground's
    # product domain. Those are all build-scoped and therefore never overwritten;
    # the baseline is deliberately the one stable path, so a reader needs no
    # build number to find it. That host is not cached, so unlike the playground
    # origin there is no purge to issue after an overwrite.
    - name: baselineDeployPath
      value: lite/bundle-baseline

stages:
    - stage: BundleBaseline
      displayName: "Bundle-Size Baseline"
      jobs:
          # ──────────────────────────────────────────────────────────────
          # Preflight — deploy configuration only, no repository code
          # ──────────────────────────────────────────────────────────────
          # Fail fast on a deploy misconfiguration BEFORE spending ~28 minutes
          # measuring scenes. The first master run did all that work and then
          # lost it in a 2-second publish step.
          #
          # Variables are read through env: rather than inline $(VAR) so an
          # unresolved one arrives as the harmless literal string "$(VAR)"
          # instead of being evaluated by bash as a command substitution.
          # That is what turned a missing variable into an opaque HTTP 401
          # rather than a named error.
          - job: Preflight
            displayName: "Check deploy configuration"
            # Exact full ref, and a reason that is not a pull request. This job
            # maps the deployment groups purely to check them, so it holds the
            # same credentials the publish job does; a manual queue can name any
            # ref, so the branch filter above is not by itself a statement about
            # which commit runs. The enforceable half is a server-side
            # branch-control check on the two variable groups — see TESTING.md,
            # "Settings that repository files cannot enforce".
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
            pool:
                vmImage: "ubuntu-latest"
            variables:
                # DEPLOYMENT_SERVER / DEPLOY_TOKEN / DEPLOY_ENDPOINT_UPLOAD come
                # from this group — the same upload path the test-report and
                # static-lab-site templates use.
                - group: BabylonJS-Deployment
                # The snapshots storage account lives here as
                # SNAPSHOTS_STORAGE_ACCOUNT. Note the rename: the upload
                # templates take a parameter called storageAccount, but no group
                # exports that name — each pipeline maps its own account
                # variable into it. Assuming a bare STORAGE_ACCOUNT existed is
                # what broke the first master run (build 20260825.1).
                - group: BabylonJS-CI-Infrastructure
            steps:
                - checkout: none

                - script: |
                      set -euo pipefail

                      missing=0

                      # Build the literal ADO leaves behind for an unresolved macro
                      # without writing a dollar-paren sequence anywhere in this
                      # file: ADO would expand that itself before bash ever saw it,
                      # and the comparison would then always be true.
                      dollar='$'

                      # DEPLOY_TOKEN is a secret, so it is checked differently from
                      # the rest: its value is never echoed, and it is not matched
                      # on a bare '$' because a token may legitimately contain one.
                      # Comparing against its own unresolved macro is exact, so it
                      # cannot false-positive on a valid token while still catching
                      # a missing or misnamed variable -- which ADO would otherwise
                      # hand us as a non-empty string that sails past a -z test.
                      if test -z "${DEPLOY_TOKEN-}" ||
                         test "${DEPLOY_TOKEN-}" = "${dollar}(DEPLOY_TOKEN)"; then
                        echo "Required deploy variable DEPLOY_TOKEN is missing or did not resolve."
                        missing=1
                      fi

                      for name in DEPLOYMENT_SERVER DEPLOY_ENDPOINT_UPLOAD STORAGE_ACCOUNT; do
                        value="${!name-}"
                        case "$value" in
                          "")
                            echo "Required deploy variable $name is empty."
                            missing=1
                            ;;
                          *'$'*)
                            # ADO leaves an unknown variable as literal text, so a
                            # surviving '$' means the variable was never defined.
                            echo "Required deploy variable $name did not resolve (got: '$value')."
                            missing=1
                            ;;
                        esac
                      done

                      if test "$missing" -ne 0; then
                        echo ""
                        echo "DEPLOYMENT_SERVER/DEPLOY_ENDPOINT_UPLOAD/DEPLOY_TOKEN come from the"
                        echo "BabylonJS-Deployment variable group; the storage account comes from"
                        echo "SNAPSHOTS_STORAGE_ACCOUNT in BabylonJS-CI-Infrastructure. Both groups"
                        echo "must be listed under variables: in this file AND authorized for this"
                        echo "pipeline in the ADO UI. Note that no group exports a bare"
                        echo "STORAGE_ACCOUNT — that name is the upload template's parameter, which"
                        echo "each pipeline maps from its own account variable."
                        exit 1
                      fi

                      echo "Deploy configuration present; publishing to storage account '$STORAGE_ACCOUNT'."
                  displayName: "Check deploy configuration"
                  env:
                      DEPLOYMENT_SERVER: $(DEPLOYMENT_SERVER)
                      DEPLOY_ENDPOINT_UPLOAD: $(DEPLOY_ENDPOINT_UPLOAD)
                      DEPLOY_TOKEN: $(DEPLOY_TOKEN)
                      STORAGE_ACCOUNT: $(SNAPSHOTS_STORAGE_ACCOUNT)

          # ──────────────────────────────────────────────────────────────
          # Measure — repository code, no credentials
          # ──────────────────────────────────────────────────────────────
          - job: Measure
            displayName: "Measure scenes and stage the baseline"
            dependsOn: Preflight
            timeoutInMinutes: 120
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm exec playwright install chromium
                  displayName: "Install Playwright browsers"

                # Same rolling URL->bytes asset cache as the PR job: the exact key
                # never hits (so newly fetched assets are always saved at job end)
                # while restoreKeys restores the most recent prefix match.
                # Measurement re-fetches on a miss, so a cold cache is only slower.
                - task: Cache@2
                  displayName: "Cache remote scene assets"
                  inputs:
                      key: 'bundle-assets | v1 | "$(Build.BuildId)"'
                      restoreKeys: |
                          bundle-assets | v1
                      path: $(System.DefaultWorkingDirectory)/.bundle-asset-cache

                # Enforces the per-scene maxRawKB ceilings byte-exactly and fails
                # the job when one is exceeded, so a breach can never be published
                # as the new baseline by the job below.
                #
                # BUNDLE_MASTER_MANIFEST_URL is blanked so this build does not
                # fetch the previous baseline just to overwrite it.
                - script: pnpm build:bundle-scenes
                  displayName: "Build bundle scenes"
                  env:
                      SKIP_BJS: "true"
                      BUNDLE_MASTER_MANIFEST_URL: ""

                # Stamps each scene with the ceiling it was measured against and
                # writes the meta.json provenance sidecar. Exits non-zero on an
                # empty or unreadable manifest.
                - script: |
                      set -euo pipefail

                      MANIFEST="$(System.DefaultWorkingDirectory)/lab/public/bundle/manifest.json"
                      WORK="$(Build.ArtifactStagingDirectory)/bundle-baseline"

                      if ! test -s "$MANIFEST"; then
                        echo "No aggregate manifest at $MANIFEST — refusing to publish an empty baseline."
                        exit 1
                      fi

                      SCENES="$(node -e 'process.stdout.write(String(Object.keys(require(process.argv[1])).length))' "$MANIFEST")"
                      echo "Staging bundle-size baseline for $SCENES scene(s)."

                      BUNDLE_BASELINE_MANIFEST="$MANIFEST" BUNDLE_BASELINE_STAGING="$WORK" \
                        pnpm exec tsx scripts/publish-bundle-baseline.ts
                  displayName: "Stage bundle-size baseline"

                - task: PublishPipelineArtifact@1
                  displayName: "Stage baseline for trusted publish"
                  inputs:
                      targetPath: $(Build.ArtifactStagingDirectory)/bundle-baseline
                      artifact: bundle-baseline

          # ──────────────────────────────────────────────────────────────
          # Publish — credentials, no repository code
          # ──────────────────────────────────────────────────────────────
          # Immutable per-commit copy first. If that upload fails the job stops
          # there and the mutable copy is left untouched, so "latest" and its
          # per-commit twin never disagree about what a commit measured.
          - job: Publish
            displayName: "Publish the baseline"
            dependsOn: Measure
            # Exact full ref and reason, as on Preflight above: this job holds
            # DEPLOY_TOKEN.
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
            pool:
                vmImage: "ubuntu-latest"
            variables:
                - group: BabylonJS-Deployment
                - group: BabylonJS-CI-Infrastructure
            steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: "Download staged baseline"
                  inputs:
                      artifact: bundle-baseline
                      path: $(Pipeline.Workspace)/bundle-baseline

                # Publish the aggregate manifest to the same public storage that
                # serves the per-build test reports and lab sites, at a stable
                # path. PR builds and local developers read it over plain HTTPS —
                # no auth, no ADO artifact retention window, and it works for fork
                # PRs.
                #
                # --fail-with-body so an upload rejection fails the step instead of
                # silently leaving the baseline stale. --proto '=https' and the
                # absence of -L keep the Authorization header on the host that was
                # checked: a redirect is otherwise a way to move a bearer token to
                # a destination nothing validated.
                #
                # DEPLOYMENT_SERVER/DEPLOY_ENDPOINT_UPLOAD/STORAGE_ACCOUNT are read
                # from env: (see the preflight step above for why), and DEPLOY_TOKEN
                # too, so the secret never appears in the generated script body —
                # and it goes to curl on stdin as a `--config -` file rather than
                # in an `-H` argument, so it never appears in argv either.
                #
                # No repository code has run on this agent — the job checks out
                # nothing and only downloads an artifact — so unlike the former
                # single-job shape there is no step that could have redirected
                # DEPLOYMENT_SERVER with `##vso[task.setvariable]` before this runs.
                - script: |
                      set -euo pipefail

                      WORK="$(Pipeline.Workspace)/bundle-baseline"

                      if ! test -s "$WORK/manifest.json"; then
                        echo "No staged manifest at $WORK/manifest.json — refusing to publish an empty baseline."
                        exit 1
                      fi

                      SCENES="$(node -e 'process.stdout.write(String(Object.keys(require(process.argv[1])).length))' "$WORK/manifest.json")"
                      echo "Publishing bundle-size baseline for $SCENES scene(s)."

                      (cd "$WORK" && zip -j baseline.zip manifest.json impact-manifest.json meta.json)

                      # An https URL is not a destination check — any host serves
                      # https. When the deployment group carries an allowlist, the
                      # host has to be in it. This job runs no repository code, so
                      # nothing here can have rewritten either variable first.
                      case "${DEPLOYMENT_SERVER}" in
                          https://*) ;;
                          *)
                              echo "Refusing upload: DEPLOYMENT_SERVER is not an https URL."
                              exit 1
                              ;;
                      esac

                      # Extract the host the same way the upload templates do,
                      # and refuse the shapes that move the request — and with it
                      # the Authorization header — somewhere else while still
                      # reading as the right host: embedded userinfo
                      # ('https://real-host@attacker/'), or characters that are
                      # not valid in a host or port. The former matters most
                      # exactly when the allowlist below is empty, which is the
                      # one path that does not compare the host to anything.
                      SERVER_HOST="${DEPLOYMENT_SERVER#https://}"
                      SERVER_HOST="${SERVER_HOST%%/*}"
                      case "$SERVER_HOST" in
                          "" | *[!A-Za-z0-9.:-]*)
                              echo "Refusing upload: DEPLOYMENT_SERVER host is empty or contains characters that are not permitted in a host."
                              exit 1
                              ;;
                      esac

                      if [ -n "${DEPLOY_HOST_ALLOWLIST:-}" ]; then
                        matched=""
                        for allowed in $(printf '%s' "${DEPLOY_HOST_ALLOWLIST}" | tr ',' ' '); do
                          if [ "$SERVER_HOST" = "$allowed" ]; then matched="yes"; fi
                        done
                        if [ -z "$matched" ]; then
                          echo "Refusing upload: '$SERVER_HOST' is not in DEPLOY_HOST_ALLOWLIST."
                          exit 1
                        fi
                      else
                        echo "##vso[task.logissue type=warning]DEPLOY_HOST_ALLOWLIST is empty; uploading to '$SERVER_HOST' unchecked."
                      fi

                      # DEPLOY_TOKEN reaches curl on stdin as a config file rather
                      # than in argv. An argument is not a private channel: it
                      # sits in the process's own /proc/<pid>/cmdline for the
                      # life of the call, readable by every process running as
                      # the same user on the agent, it is what `ps` prints, and
                      # agent diagnostics collect it. None of that is touched by
                      # log masking. `--config -` takes the same `header =`
                      # setting `-H` does.
                      #
                      # The escaping is required because a curl config value is a
                      # quoted string: a token containing a backslash or a double
                      # quote would otherwise end the value early and send a
                      # truncated header.
                      token_escaped=${DEPLOY_TOKEN//\\/\\\\}
                      token_escaped=${token_escaped//\"/\\\"}

                      # Immutable per-commit copy first. If that upload fails the step stops
                      # here and the mutable copy is left untouched, so "latest" and its
                      # per-commit twin never disagree about what a commit measured.
                      for deployPath in "$(baselineDeployPath)/$(Build.SourceVersion)" "$(baselineDeployPath)"; do
                        echo "Uploading baseline to $deployPath"
                        printf 'header = "Authorization: Bearer %s"\n' "$token_escaped" |
                        curl "${DEPLOYMENT_SERVER}/${DEPLOY_ENDPOINT_UPLOAD}" --config - --fail-with-body --silent --show-error -X POST \
                          --proto '=https' --max-time 600 \
                          -H "Content-Type: multipart/form-data" \
                          -F "path=$deployPath" \
                          -F "storageAccount=${STORAGE_ACCOUNT}" \
                          -F "zip=@$WORK/baseline.zip"
                      done
                  displayName: "Publish bundle-size baseline"
                  env:
                      DEPLOYMENT_SERVER: $(DEPLOYMENT_SERVER)
                      DEPLOY_ENDPOINT_UPLOAD: $(DEPLOY_ENDPOINT_UPLOAD)
                      DEPLOY_HOST_ALLOWLIST: $(DEPLOY_HOST_ALLOWLIST)
                      STORAGE_ACCOUNT: $(SNAPSHOTS_STORAGE_ACCOUNT)
                      DEPLOY_TOKEN: $(DEPLOY_TOKEN)
