<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Babylon Lite Playground</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div id="app">
            <header class="toolbar" id="toolbarRoot"></header>
            <main class="split" id="split">
                <section class="pane pane-editor">
                    <div class="file-tabs" id="fileTabs" role="tablist" aria-label="Project files"></div>
                    <div id="editor"></div>
                </section>
                <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" tabindex="0"></div>
                <section class="pane pane-preview">
                    <div class="preview-host" id="previewHost">
                        <div class="preview-loader" id="previewLoader">
                            <div class="loader-spinner">
                                <img class="loader-logo" src="/favicon.svg" alt="" width="52" height="52" />
                                <svg class="loader-ring" viewBox="0 0 100 100" aria-hidden="true">
                                    <circle class="loader-ring-track" cx="50" cy="50" r="46" />
                                    <circle class="loader-ring-arc" cx="50" cy="50" r="46" />
                                </svg>
                            </div>
                            <span class="loader-text" id="previewLoaderText" role="status" aria-live="polite">Loading…</span>
                        </div>
                        <div class="preview-overlay">
                            <span id="fpsCounter" class="fps-counter" title="Frames per second" hidden>0 FPS</span>
                            <button id="fullscreenBtn" class="overlay-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="console" id="console" aria-live="polite"></div>
                </section>
            </main>
            <div id="settingsBackdrop" class="settings-backdrop" hidden></div>
            <aside id="settingsDrawer" class="settings-drawer" aria-label="Playground settings" hidden>
                <div id="settingsRoot" class="settings-root"></div>
            </aside>
        </div>
        <div id="appChromeRoot"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
