# Azure Pipelines — Babylon Lite Demos Deployment
#
# Builds the standalone Lite demos and deploys the generated static output to
# the Babylon.js website CDN through the deployment server.
#
# ── WHY THIS IS TWO JOBS ─────────────────────────────────────────────────────
#
# Building the demos runs repository code: `pnpm install` executes dependency
# lifecycle scripts, `pnpm build:bundle-demos` executes the repository's own
# build and a real browser. Any of that can emit `##vso[task.setvariable]` and
# rewrite a pipeline variable for every later step in the same job — including
# DEPLOYMENT_SERVER, which decides where DEPLOY_TOKEN is sent.
#
# So the build never shares an agent with the credential. `Build` holds no
# variable group at all and hands its output over as a pipeline artifact;
# `Deploy` starts from a clean agent with `checkout: none`, so the only thing on
# it is the artifact and the upload template itself. A compromised dependency
# can still produce bad demo content, which is a supply-chain problem for the
# site — it can no longer take the deployment credential with it.

trigger:
    branches:
        include:
            - master

pr: none

variables:
    - name: NODE_VERSION
      value: "22.x"
    - name: PNPM_VERSION
      value: "11.9.0"
    - name: CI
      value: "true"
    - name: HEADLESS
      value: "true"

stages:
    - stage: DeployDemos
      displayName: "Deploy Lite Demos"
      jobs:
          # ──────────────────────────────────────────────────────────────
          # Build — repository code, no credentials
          # ──────────────────────────────────────────────────────────────
          - job: Build
            displayName: "Build Lite Demos"
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      corepack enable
                      corepack prepare pnpm@$(PNPM_VERSION) --activate
                  displayName: "Enable pnpm via corepack"

                - script: pnpm install --frozen-lockfile
                  displayName: "Install dependencies"

                - script: pnpm exec playwright install chrome
                  displayName: "Install Chrome for bundle measurement"

                - script: pnpm build:bundle-demos
                  displayName: "Build demo bundles and static files"
                  env:
                      HEADLESS: "true"

                - script: |
                      set -euo pipefail
                      DEMOS_DIR="$(System.DefaultWorkingDirectory)/lab/public/bundle/demos"
                      if ! test -d "$DEMOS_DIR"; then
                        echo "No demos build output found at $DEMOS_DIR"
                        exit 1
                      fi
                  displayName: "Verify demos build output"

                - task: PublishPipelineArtifact@1
                  displayName: "Stage demos for trusted deploy"
                  inputs:
                      targetPath: $(System.DefaultWorkingDirectory)/lab/public/bundle/demos
                      artifact: demos-site

          # ──────────────────────────────────────────────────────────────
          # Deploy — credentials, no repository code
          # ──────────────────────────────────────────────────────────────
          - job: Deploy
            displayName: "Deploy Lite Demos"
            dependsOn: Build
            # Exact full ref, and a reason that is not a pull request. `pr: none`
            # plus the `- master` branch filter describe the automatic trigger;
            # neither constrains a manual queue, which may name any ref — and the
            # YAML such a run executes is that ref's YAML, which is why the
            # enforceable half of this is a server-side branch-control check on
            # BabylonJS-Deployment and BabylonJS-CI-Infrastructure (see
            # TESTING.md, "Settings that repository files cannot enforce"). This
            # condition is what states the rule for every run that is still
            # executing master's definition.
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
            pool:
                vmImage: "ubuntu-latest"
            variables:
                - group: BabylonJS-Deployment
                # DEPLOY_ENDPOINT_UPLOAD is stored here in the live ADO project.
                - group: BabylonJS-CI-Infrastructure
            steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: "Download demos"
                  inputs:
                      artifact: demos-site
                      path: $(Pipeline.Workspace)/demos-site

                - template: config/templates/upload-static-site.yml
                  parameters:
                      siteDir: $(Pipeline.Workspace)/demos-site
                      deployPath: cdn/website/lite-demos
                      storageAccount: babylonsnapshots
                      siteName: "Lite Demos"
                      cdnEndpoint: babylonjs-webbsite
                      cdnProfile: babylonjscdn
                      postComment: false
                      # A master deployment is not advisory: a refused or failed
                      # upload must fail the pipeline, not pass quietly.
                      continueOnError: false
